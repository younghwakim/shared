function $(i){return document.getElementById(i)}
function setLang(l){
  var t=T[l]; document.documentElement.lang=l;
  $('h1').innerHTML=t.h1;
  document.querySelectorAll('[data-i]').forEach(function(el){var v=t[el.dataset.i]; if(typeof v==='string') el.textContent=v;});
  // 결과 카드(「1등 감자」) 실제 캡처는 한국어판만 있다. 영어·일본어는 내 1등 줄이 보이는 오늘 화면
  $('heroShot').src = l==='ko' ? 'assets/ko/result.jpg' : 'assets/'+l+'/home.jpg';
  document.querySelectorAll('[data-shot]').forEach(function(img){img.src='assets/'+l+'/'+img.dataset.shot+'.jpg';});
  $('table').innerHTML=PAIRS[l].map(function(p){return '<div class="tr"><b>'+p[0]+'</b><span>'+p[1]+'</span><span class="o">'+p[2]+'</span></div>';}).join('');
  $('facts').innerHTML=t.facts.map(function(f){return '<div class="f"><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div>';}).join('');
  var wide=matchMedia('(min-width:900px)').matches, spots=wide?SPOT_D:SPOT_M;
  $('heap').innerHTML=HEAP[l].slice(0,spots.length).map(function(n,i){var s=spots[i];
    return '<span class="pill'+(i%3===2?' w':'')+'" style="'+(!wide&&s[0]>50?'right:'+(100-s[0]):'left:'+s[0])+'%;--y:'+s[1]+'%;--r:'+s[2]+'deg;--s:'+s[3]+'px;--d:'+(i*70)+'ms">'+t.first(n)+'</span>';}).join('');
  document.querySelectorAll('.langs button').forEach(function(b){b.classList.toggle('on',b.dataset.lang===l);});
  var cc=l==='ko'?'kr':l==='ja'?'jp':'us';
  document.querySelectorAll('[data-store]').forEach(function(a){a.href='https://apps.apple.com/'+cc+'/app/id6809404958';});
}
document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang); try{localStorage.setItem('lang',b.dataset.lang);}catch(e){}});});
var l=null; try{ l=new URLSearchParams(location.search).get('lang'); if(!T[l]) l=localStorage.getItem('lang'); }catch(e){}
if(!T[l]){ var n=(navigator.language||'en').slice(0,2); l=T[n]?n:'en'; }
setLang(l);
// 진짜 남은 시간(앱과 같은 KST 자정 기준)
function tick(){ var now=Date.now(),day=86400000,since=((now+9*3600000)%day+day)%day,s=Math.floor((day-since)/1000);
  function p(v){return String(v).padStart(2,'0')}
  $('cd').innerHTML=p(Math.floor(s/3600))+'<b>:</b>'+p(Math.floor(s%3600/60))+'<b>:</b>'+p(s%60); }
tick(); setInterval(tick,1000);
</script>
