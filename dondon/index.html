<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돈돈 — 동전 합치기 머지 게임</title>
<meta name="description" content="같은 돈 둘이 닿으면 한 단계 큰 돈. 1원에서 태산 1억까지 13단계. 계정 없이 바로 시작하는 무료 iPhone 게임.">
<meta name="theme-color" content="#F7F2E6">
<meta name="apple-itunes-app" content="app-id=6824332308">
<link rel="canonical" href="https://younghwakim.github.io/shared/dondon/">
<link rel="icon" href="assets/icon.webp">
<meta property="og:type" content="website">
<meta property="og:title" content="돈돈 — 동전 합치기 머지 게임">
<meta property="og:description" content="같은 돈 둘이 닿으면 한 단계 큰 돈. 1원에서 태산 1억까지 13단계.">
<meta property="og:image" content="https://younghwakim.github.io/shared/dondon/assets/og.jpg">
<meta property="og:url" content="https://younghwakim.github.io/shared/dondon/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 돈돈의 색 — 앱과 같은 값(brand.json). 크림 종이 위에 지폐 초록, 포인트는 금, 저금통 안은 짙은 초록 펠트 */
  :root{
    --bg:#F7F2E6; --ink:#2B2418; --muted:#6E6250; --faint:#A39682; --surface:#FFFFFF; --soft:#EDE6D4; --line:#DED4BE;
    --green:#2E7D5B; --green-deep:#1F5C42; --gold:#E2A91E; --gold-soft:#F7E6A3; --felt:#24544A; --felt-deep:#173B33; --felt-line:#8FC7B0; --danger:#D6453D;
    --display:"Jua","Fredoka","Zen Maru Gothic",system-ui,sans-serif;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Segoe UI",sans-serif;
    --maxw:1080px; --r:22px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.6; letter-spacing:-.01em; word-break:keep-all; overflow-wrap:break-word; overflow-x:hidden}
  html[lang="en"] body{word-break:normal}
  html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; word-break:normal; line-break:strict}
  img,video,canvas{max-width:100%; height:auto; display:block}
  a{color:inherit}
  h1,h2,h3,p{margin:0}
  h1,h2,h3,.disp{font-family:var(--display); font-weight:400; letter-spacing:0; text-wrap:balance}
  html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] .disp{font-family:"Fredoka",system-ui,sans-serif; font-weight:600; letter-spacing:-.02em}
  html[lang="ja"] h1, html[lang="ja"] h2, html[lang="ja"] h3, html[lang="ja"] .disp{font-family:"Zen Maru Gothic","Hiragino Sans",sans-serif; font-weight:900}
  :focus-visible{outline:3px solid var(--green); outline-offset:3px; border-radius:10px}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
  [hidden]{display:none !important}

  /* 단추 — 앱의 둥근 초록 단추 */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; font-family:var(--display); font-size:1.15rem; line-height:1; text-decoration:none; color:#fff; background:var(--green); border:0; border-radius:16px; padding:17px 26px; cursor:pointer; box-shadow:0 4px 0 var(--green-deep); transition:transform .12s, box-shadow .12s; white-space:nowrap}
  html[lang="en"] .btn{font-weight:600}
  .btn:hover{transform:translateY(-1px); box-shadow:0 5px 0 var(--green-deep)}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-deep)}
  .btn.ghost{background:var(--surface); color:var(--ink); box-shadow:0 4px 0 var(--line); border:1.5px solid var(--line)}
  .btn.ghost:hover{box-shadow:0 5px 0 var(--line)} .btn.ghost:active{box-shadow:0 1px 0 var(--line)}
  .btn.small{font-size:.98rem; padding:11px 16px; border-radius:12px; box-shadow:0 3px 0 var(--green-deep)}
  .btn svg{width:20px; height:20px; flex:none}

  header{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; height:66px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--display); font-size:1.55rem; color:var(--green)}
  .brand img{width:36px; height:36px; border-radius:10px}
  .right{display:flex; align-items:center; gap:10px}
  .langs{display:flex; gap:2px; background:var(--surface); border:1.5px solid var(--line); padding:3px; border-radius:999px}
  .langs button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:.8rem; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .langs button.on{background:var(--ink); color:var(--bg)}
  @media(max-width:560px){ header .btn{display:none} }

  /* ── 첫 화면 ── */
  .hero{padding:28px 0 56px}
  .hero-grid{display:grid; gap:34px; align-items:center}
  @media(min-width:900px){ .hero{padding:52px 0 88px} .hero-grid{grid-template-columns:1.05fr .95fr; gap:48px} }
  h1{font-size:clamp(2.1rem,7.2vw,4rem); line-height:1.14}
  h1 .hl{color:var(--green)}
  .sub{margin-top:18px; font-size:clamp(1.05rem,2.2vw,1.2rem); color:var(--muted); max-width:36ch; line-height:1.65}
  .cta{display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; margin-top:26px}
  .cta-note{font-size:.92rem; color:var(--muted); font-weight:600}
  .order{display:flex; flex-wrap:wrap; gap:6px; margin-top:26px}
  .order span{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:4px 10px 4px 5px; font-size:.86rem; font-weight:700; color:var(--muted)}
  .order img{width:22px; height:22px}
  .order b{color:var(--ink); font-weight:800}

  /* 떨어뜨려 보는 저금통 */
  .toy{position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:30px; box-shadow:0 10px 30px rgba(43,36,24,.08); padding:14px 14px 12px; max-width:440px; width:100%; margin:0 auto}
  .toy-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 6px 10px}
  .toy-score{font-family:var(--display); font-size:1.7rem; line-height:1; font-variant-numeric:tabular-nums}
  html[lang="en"] .toy-score{font-weight:600}
  .toy-score small{display:block; font-family:var(--font); font-size:.72rem; color:var(--faint); font-weight:700; margin-bottom:4px; letter-spacing:0}
  .next{display:flex; align-items:center; gap:8px; background:var(--soft); border-radius:14px; padding:6px 10px; font-size:.78rem; font-weight:700; color:var(--muted)}
  .next img{width:30px; height:30px}
  .jar{position:relative; border-radius:22px; overflow:hidden; background:radial-gradient(120% 90% at 50% 20%, #2C6A5C 0%, var(--felt) 55%, var(--felt-deep) 100%); border:5px solid #DCEFE6; box-shadow:inset 0 0 0 2px rgba(0,0,0,.15); touch-action:none; cursor:crosshair}
  .jar canvas{width:100%; height:auto; display:block}
  .over{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(23,59,51,.78); color:#fff; text-align:center; padding:20px}
  .over h3{font-size:1.6rem; color:#fff}
  .over p{font-size:.95rem; opacity:.85}
  .toy-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; min-height:30px; padding:0 4px}
  .toy-msg{font-size:.9rem; font-weight:600; color:var(--muted)}
  .pop{position:absolute; font-family:var(--display); color:#FFE27A; font-size:1.2rem; text-shadow:0 1px 3px rgba(0,0,0,.5); pointer-events:none; animation:pop .9s ease-out forwards; transform:translate(-50%,-50%)}
  @keyframes pop{0%{opacity:1; transform:translate(-50%,-50%) scale(.7)} 20%{transform:translate(-50%,-70%) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-140%) scale(1)}}

  section{padding:56px 0}
  @media(min-width:900px){ section{padding:84px 0} }
  h2{font-size:clamp(1.8rem,4.4vw,2.6rem); line-height:1.15}
  .sec-h{margin-bottom:10px}
  .sec-p{color:var(--muted); margin-bottom:28px; max-width:60ch}

  /* ── 13단계 ── */
  .ladder{display:flex; gap:10px; overflow-x:auto; padding:10px 20px 18px; margin:0 -20px; scroll-snap-type:x proximity; scrollbar-width:thin; align-items:flex-end}
  .step{flex:none; width:118px; text-align:center; scroll-snap-align:start; background:var(--surface); border:1.5px solid var(--line); border-radius:20px; padding:12px 8px 12px; position:relative}
  .step img{margin:0 auto 8px; width:var(--s); height:var(--s)}
  .step b{display:block; font-family:var(--display); font-size:1.05rem; line-height:1.2}
  html[lang="en"] .step b{font-weight:600}
  .step small{display:block; color:var(--faint); font-size:.74rem; font-weight:700; margin-top:2px; line-height:1.3}
  .step i{position:absolute; top:8px; left:10px; font-style:normal; font-size:.7rem; font-weight:800; color:var(--faint)}
  .step.top{background:linear-gradient(180deg,#FFF7DB,#F7E6A3); border-color:var(--gold)}
  .arrow{flex:none; align-self:center; color:var(--faint); font-size:1.2rem; margin:0 -4px 20px}

  /* ── 하는 법 ── */
  .how{display:grid; gap:14px; counter-reset:step; list-style:none; margin:0; padding:0}
  @media(min-width:860px){ .how{grid-template-columns:repeat(3,1fr); gap:18px} }
  .how li{counter-increment:step; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:22px 22px 22px}
  .how li::before{content:counter(step); display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:var(--gold); color:var(--ink); font-family:var(--display); font-size:1.2rem; margin-bottom:14px}
  .how h3{font-size:1.3rem}
  .how p{color:var(--muted); font-size:1rem; line-height:1.55; margin-top:6px}

  /* ── 저금통 셋 ── */
  .jars{display:grid; gap:16px}
  @media(min-width:760px){ .jars{grid-template-columns:repeat(3,1fr)} }
  .jarcard{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:22px 20px 20px; text-align:center}
  .jarcard img{height:150px; width:auto; margin:0 auto 12px}
  .jarcard h3{font-size:1.35rem}
  .jarcard .cost{display:inline-block; font-size:.78rem; font-weight:800; color:var(--muted); background:var(--soft); border-radius:999px; padding:3px 10px; margin:8px 0 10px}
  .jarcard p{color:var(--muted); font-size:.95rem; line-height:1.55}
  .jarcard .tag{display:inline-block; margin-top:10px; font-size:.82rem; font-weight:800; color:var(--green)}

  /* ── 아이템 ── */
  .items{display:grid; gap:12px; grid-template-columns:1fr 1fr}
  @media(min-width:760px){ .items{grid-template-columns:repeat(3,1fr)} }
  .item{display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:16px}
  .item .ic{flex:none; width:44px; height:44px; border-radius:12px; background:var(--soft); display:flex; align-items:center; justify-content:center}
  .item .ic svg{width:24px; height:24px}
  .item h3{font-size:1.1rem}
  .item p{color:var(--muted); font-size:.9rem; line-height:1.5; margin-top:3px}
  @media(max-width:420px){ .items{grid-template-columns:1fr} }

  /* ── 안 하는 것 ── */
  .keep{background:var(--felt); color:#fff}
  .keep h2{color:#fff}
  .keep .sec-p{color:var(--felt-line)}
  .nots{list-style:none; margin:0; padding:0; display:grid; gap:12px}
  @media(min-width:760px){ .nots{grid-template-columns:repeat(3,1fr)} }
  .nots li{display:flex; gap:12px; align-items:flex-start; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.14); border-radius:18px; padding:16px 18px; font-weight:600; line-height:1.5}
  .nots svg{width:24px; height:24px; flex:none; margin-top:2px}

  /* ── 앱 화면 ── */
  .shots{display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:6px 20px 22px; margin:0 -20px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
  .shots img{flex:none; width:min(240px,62vw); border-radius:26px; scroll-snap-align:center; box-shadow:0 10px 30px rgba(43,36,24,.12); background:var(--surface)}
  @media(min-width:1100px){ .shots{overflow:visible; justify-content:space-between; margin:0; padding:6px 0 22px} .shots img{width:calc(20% - 13px)} }

  .end{text-align:center; padding-bottom:72px}
  .end img{width:120px; margin:0 auto 10px}
  .end h2{margin-bottom:10px}
  .end p{color:var(--muted); font-weight:600; margin-bottom:24px}

  footer{border-top:1.5px solid var(--line); padding:28px 0 40px; font-size:.92rem; color:var(--muted)}
  .foot{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; justify-content:space-between}
  .foot nav{display:flex; flex-wrap:wrap; gap:8px 18px}
  .foot a{font-weight:700; text-decoration:none; color:var(--ink)}
  .foot a:hover{text-decoration:underline}
  .foot small{display:block; width:100%; color:var(--faint); font-size:.82rem; margin-top:8px}

  @media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .btn{transition:none} .pop{animation-duration:.01s} }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><img src="assets/icon.webp" width="36" height="36" alt=""><span data-i="brand">돈돈</span></a>
    <div class="right">
      <div class="langs" id="langs" aria-label="Language">
        <button data-lang="ko">한국어</button>
        <button data-lang="en">EN</button>

<section class="hero">
  <div class="wrap hero-grid">

      <li><h3 data-i="s1t"></h3><p data-i="s1d"></p></li>
      <li><h3 data-i="s2t"></h3><p data-i="s2d"></p></li>
      <li><h3 data-i="s3t"></h3><p data-i="s3d"></p></li>
    </ol>
  </div>
</section>

<section aria-labelledby="jarH" style="padding-top:8px">
  <div class="wrap">
    <h2 class="sec-h" id="jarH" data-i="jarH"></h2>
    <p class="sec-p" data-i="jarP"></p>
    <div class="jars">
      <div class="jarcard"><img src="assets/jars/water.webp" alt="" loading="lazy"><h3 data-i="j1t"></h3><div class="cost" data-i="j1c"></div><p data-i="j1d"></p></div>
      <div class="jarcard"><img src="assets/jars/pig.webp" alt="" loading="lazy"><h3 data-i="j2t"></h3><div class="cost" data-i="j2c"></div><p data-i="j2d"></p></div>

    </div>

<section aria-labelledby="itemH" style="padding-top:8px">

(function(){
  // ── 돈 13종: 앱의 game/items.ts 와 같은 순서·반지름(통 너비 대비) ──
  var ITEMS = [
    { id:'w1', v:1, r:.040 }, { id:'w5', v:5, r:.050 }, { id:'w10', v:10, r:.060 }, { id:'w50', v:50, r:.073 }, { id:'w100', v:100, r:.087 }, { id:'w500', v:500, r:.103 },
    { id:'w1000', v:1000, r:.120 }, { id:'w5000', v:5000, r:.139 }, { id:'w10000', v:10000, r:.159 }, { id:'w50000', v:50000, r:.181 },
    { id:'gold', v:1000000, r:.205 }, { id:'diamond', v:10000000, r:.232 }, { id:'mountain', v:100000000, r:.262 }
  ];

  var M = window.Matter, cv = $('cv'), ctx = cv.getContext('2d'), jarEl = $('jar');

  function radius(t){ return ITEMS[t-1].r * W; }

  function make(t, x, y){

  }

    if (engine) M.Engine.clear(engine);

    var wall = 60;
    M.Composite.add(world, [
      M.Bodies.rectangle(W/2, H + wall/2, W + wall*2, wall, { isStatic:true, friction:.8, label:'floor' }),
      M.Bodies.rectangle(-wall/2, H/2, wall, H*3, { isStatic:true, friction:.12, label:'wall' }),
      M.Bodies.rectangle(W + wall/2, H/2, wall, H*3, { isStatic:true, friction:.12, label:'wall' })
    ]);
    M.Events.on(engine, 'collisionStart', function(ev){
      ev.pairs.forEach(function(p){
        var a = p.bodyA, b = p.bodyB, wallish = a.label === 'wall' || b.label === 'wall';
        if (!wallish){ if (a.tier && !a.settled) a.settled = true; if (b.tier && !b.settled) b.settled = true; }
        if (a.tier && b.tier && a.tier === b.tier) pending.push([a, b]);

    curTier = pick(); nextTier = pick(); canDrop = true; $('over').hidden = true; sync();
  }

  function merges(){
    if (!pending.length) return;

    list.forEach(function(pr){
      var a = pr[0], b = pr[1];
      if (used[a.id] || used[b.id] || bodies.indexOf(a) < 0 || bodies.indexOf(b) < 0) return;
      used[a.id] = used[b.id] = true;
      var x = (a.position.x + b.position.x)/2, y = (a.position.y + b.position.y)/2, t = a.tier;
      remove(a); remove(b);

      var n = make(t + 1, x, Math.min(H - radius(t+1), y)); n.settled = true;

  function sync(){
    var tot = banked; bodies.forEach(function(b){ tot += ITEMS[b.tier-1].v; }); score = tot;
    $('score').textContent = fmt(score); $('nextImg').src = 'assets/items/' + ITEMS[nextTier-1].id + '.webp';

    var danger = false;
    bodies.forEach(function(b){
      if (b.settled && b.position.y - radius(b.tier) < LINE){ danger = true; if (!over && b.speed < 1.5){ b.overMs += dt; if (b.overMs >= 1500) endGame(); } }
      else b.overMs = 0;
    });

  }
  function draw(danger){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== W*dpr){ cv.width = W*dpr; cv.height = H*dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    // 끝 선
    ctx.setLineDash([8, 8]); ctx.lineWidth = 2; ctx.strokeStyle = danger ? '#FF6B5E' : 'rgba(143,199,176,.7)'; ctx.beginPath(); ctx.moveTo(14, LINE); ctx.lineTo(W-14, LINE); ctx.stroke(); ctx.setLineDash([]);

    if (!over && canDrop){ var r0 = radius(curTier); ctx.globalAlpha = .95; ctx.drawImage(imgs[curTier-1], aimX - r0, 44 - r0, r0*2, r0*2); ctx.globalAlpha = .25; ctx.strokeStyle = '#fff'; ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.moveTo(aimX, 44 + r0); ctx.lineTo(aimX, H - 6); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }

    $('ladder').innerHTML = ITEMS.map(function(it, i){ var s = 40 + i*4; return '<div class="step'+(i===12?' top':'')+'" style="--s:'+s+'px"><i>'+(i+1)+'</i><img src="assets/items/'+it.id+'.webp" width="'+s+'" height="'+s+'" alt="" loading="lazy"><b>'+u.names[i]+'</b><small>'+(u.faces[i]||'&nbsp;')+'</small></div>'; }).join('<span class="arrow">›</span>');
    $('items').innerHTML = u.items.map(function(t, i){ return '<div class="item"><div class="ic">'+ICONS[i]+'</div><div><h3>'+t[0]+'</h3><p>'+t[1]+'</p></div></div>'; }).join('');
    $('nots').innerHTML = u.nots.map(function(t){ return '<li>'+CHECK+'<span>'+t+'</span></li>'; }).join('');
    $('shots').innerHTML = [1,2,3,4,5].map(function(i){ return '<img src="assets/shot-'+LANG+'-'+i+'.webp" width="480" height="1039" alt="'+u.shotsH+' '+i+'" loading="lazy">'; }).join('');
    $('toyMsg').textContent = u.hint; sync();
  }
  var buttons = document.querySelectorAll('#langs button');
  function apply(lang, save){ LANG = UI[lang] ? lang : 'en'; render(); buttons.forEach(function(b){ b.classList.toggle('on', b.dataset.lang === LANG); }); if (save){ try{ localStorage.setItem('dondon-lang', LANG); }catch(e){} } }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang, true); }); });
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  var saved = null; try{ saved = localStorage.getItem('dondon-lang'); }catch(e){}
  var sys = (navigator.language || 'en').slice(0,2).toLowerCase();
  apply((q && UI[q]) ? q : (saved && UI[saved]) ? saved : (UI[sys] ? sys : 'en'), false);
})();
</script>
</body>
</html>
