<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nom — Screenshot & File Cleaner</title>
<meta name="description" content="Feed your screenshots and downloads to Nom. Nothing is deleted until Nom digests it. No subscription, no account, nothing leaves your phone.">
<meta name="theme-color" content="#FFF8E7">
<meta name="apple-itunes-app" content="app-id=6815784303">
<link rel="canonical" href="https://younghwakim.github.io/shared/nom/">
<link rel="icon" href="assets/icon.webp">
<meta property="og:type" content="website">
<meta property="og:title" content="Nom — Screenshot & File Cleaner">
<meta property="og:description" content="Feed your screenshots and downloads to Nom. Nothing is deleted until Nom digests it.">
<meta property="og:image" content="https://younghwakim.github.io/shared/nom/assets/og.jpg">
<meta property="og:url" content="https://younghwakim.github.io/shared/nom/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 놈의 색 — 앱과 같은 값(brand.json). 화면이 하나의 세계라 밝은 판 하나만 둔다 */
  :root{
    --bg:#FFF8E7; --ink:#1C1C1C; --yellow:#FDDD43; --surface:#FFFFFF; --muted:#6B655A; --hole:#111111; --line:#EADFC4; --soft:#FFF1C2;
    --display:"Fredoka","Jua","Zen Maru Gothic","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
    --maxw:1080px; --hard:6px 6px 0 var(--ink);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.6; letter-spacing:-.01em; word-break:keep-all; overflow-wrap:break-word; overflow-x:hidden}
  html[lang="en"] body, html[lang="zh-Hant"] body{word-break:normal}
  /* 일본어·중국어는 띄어쓰기가 없어 keep-all 이면 한 문장이 통째로 한 낱말이 된다(화면 밖으로 넘침) */
  html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; word-break:normal; line-break:strict}
  html[lang="ja"] h1{font-size:clamp(1.7rem,7.2vw,2.7rem); line-height:1.25}
  html[lang="zh-Hant"] body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  img,video{max-width:100%; height:auto; display:block}
  a{color:inherit}
  h1,h2,h3,p{margin:0}
  h1,h2,h3{font-family:var(--display); font-weight:600; letter-spacing:-.02em; text-wrap:balance}
  html[lang="ja"] h1, html[lang="ja"] h2, html[lang="ja"] h3{font-weight:900; letter-spacing:-.01em}
  html[lang="zh-Hant"] h1, html[lang="zh-Hant"] h2, html[lang="zh-Hant"] h3, html[lang="zh-Hant"] .btn, html[lang="zh-Hant"] .say, html[lang="zh-Hant"] .belly{font-family:"Fredoka","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-weight:700}
  html[lang="ko"] h1, html[lang="ko"] h2, html[lang="ko"] h3, html[lang="ko"] .btn, html[lang="ko"] .say{font-family:"Fredoka","Jua",system-ui,sans-serif}
  :focus-visible{outline:4px solid var(--ink); outline-offset:3px; border-radius:10px}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
  [hidden]{display:none !important}

  /* 누르면 눌리는 두툼한 단추 — 앱의 ChunkyButton */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; font-family:var(--display); font-weight:600; font-size:1.12rem; line-height:1; text-decoration:none; color:var(--ink); background:var(--yellow); border:4px solid var(--ink); border-radius:999px; padding:16px 26px; box-shadow:0 5px 0 var(--ink); cursor:pointer; transition:transform .08s, box-shadow .08s; white-space:nowrap}
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 0 var(--ink)}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
  .btn.white{background:var(--surface)}
  .btn.small{font-size:.95rem; padding:10px 16px; border-width:3px; box-shadow:0 4px 0 var(--ink)}
  .btn[disabled]{opacity:.4; cursor:default; transform:none; box-shadow:0 5px 0 var(--ink)}
  .btn svg{width:20px; height:20px; flex:none}
  @media(max-width:360px){ .btn{font-size:.98rem; padding:14px 16px} .eats{grid-template-columns:1fr !important} }

  header{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; height:68px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--display); font-weight:700; font-size:1.5rem; letter-spacing:-.02em}
  .brand img{width:36px; height:36px; border-radius:10px; border:2.5px solid var(--ink)}
  .right{display:flex; align-items:center; gap:10px}
  .langs{display:flex; gap:2px; background:var(--surface); border:3px solid var(--ink); padding:3px; border-radius:999px}
  .langs button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:.8rem; font-weight:700; padding:5px 9px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .langs button.on{background:var(--ink); color:var(--bg)}
  @media(max-width:560px){ header .btn{display:none} .langs button{padding:5px 8px; font-size:.76rem} }

  /* ── 첫 화면: 글 + 먹여 보는 놈 ── */
  .hero{padding:28px 0 56px}
  .hero-grid{display:grid; gap:36px; align-items:center}
  @media(min-width:900px){ .hero{padding:48px 0 88px} .hero-grid{grid-template-columns:1fr 1fr; gap:48px} }
  h1{font-size:clamp(2.05rem,7.4vw,4.3rem); line-height:1.08}
  .hl{background:var(--yellow); border:4px solid var(--ink); border-radius:18px; padding:0 .18em; box-decoration-break:clone; -webkit-box-decoration-break:clone; white-space:nowrap}
  .sub{margin-top:20px; font-size:clamp(1.05rem,2.3vw,1.22rem); color:var(--muted); max-width:34ch; line-height:1.65}
  .cta{display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; margin-top:28px}
  .cta-note{font-size:.92rem; color:var(--muted); font-weight:600}

  .toy{position:relative; background:var(--surface); border:4px solid var(--ink); border-radius:34px; box-shadow:var(--hard); padding:18px 18px 16px; max-width:520px; width:100%; margin:0 auto; -webkit-user-select:none; user-select:none}
  .stage{position:relative; height:300px; border-radius:22px; background:var(--bg); border:3px solid var(--ink); overflow:hidden; display:flex; align-items:flex-end; justify-content:center}
  .nom{position:relative; width:230px; aspect-ratio:366/355; margin-bottom:26px; transform-origin:50% 100%; transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
  .nom .body{width:100%; height:100%; pointer-events:none}
  .nom .eye{position:absolute; width:5.2%; aspect-ratio:1; border-radius:50%; background:var(--ink); transform:translate(-50%,-50%); transition:transform .12s ease-out, height .08s}
  .nom .eye.l{left:30.1%; top:22.6%} .nom .eye.r{left:70.8%; top:23.5%}
  .nom.blink .eye{height:1.4%; aspect-ratio:auto; border-radius:3px; width:8%}
  .nom .mouth{position:absolute; left:51.55%; top:51.65%; width:86%; aspect-ratio:1; transform:translate(-50%,-50%) scale(0); transition:transform .14s cubic-bezier(.3,1.4,.5,1)}
  .nom.open .mouth{transform:translate(-50%,-50%) scale(1)}
  .nom.gulp{animation:gulp .22s ease-out}
  @keyframes gulp{0%{transform:var(--fat) scale(1.07,.9)} 100%{transform:var(--fat)}}
  .nom.burp{animation:burp .5s cubic-bezier(.3,1.5,.5,1)}
  @keyframes burp{0%{transform:var(--fat)} 30%{transform:var(--fat) translateY(-18px) scale(.93,1.12)} 100%{transform:var(--fat)}}
  .shadow{position:absolute; left:50%; bottom:16px; width:200px; height:22px; border-radius:50%; background:rgba(28,28,28,.13); transform:translateX(-50%)}
  .cloud{position:absolute; right:16%; top:20%; width:74px; opacity:0; pointer-events:none}
  .cloud.go{animation:cloud 1.1s ease-out}
  @keyframes cloud{0%{opacity:0; transform:translate(-10px,16px) scale(.5)} 20%{opacity:1; transform:translate(0,0) scale(1)} 100%{opacity:0; transform:translate(22px,-46px) scale(1.05)}}
  .say{position:absolute; left:50%; top:14px; transform:translateX(-50%); background:var(--surface); border:3px solid var(--ink); border-radius:14px; padding:4px 14px; font-family:var(--display); font-weight:600; font-size:1rem; white-space:nowrap; box-shadow:3px 3px 0 var(--ink)}
  .belly{position:absolute; left:50%; top:64%; transform:translate(-50%,-50%) scale(0); font-family:var(--display); font-weight:700; text-align:center; line-height:1; transition:transform .2s cubic-bezier(.3,1.6,.5,1); pointer-events:none}
  .belly.on{transform:translate(-50%,-50%) scale(1)}
  .belly small{display:inline-block; font-size:.72rem; background:var(--surface); border:2.5px solid var(--ink); border-radius:999px; padding:2px 9px; margin-bottom:2px}
  .belly b{display:block; font-size:2.5rem; font-variant-numeric:tabular-nums}
  .tray{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; touch-action:pan-y}
  .tile{position:relative; aspect-ratio:1; padding:0; border:3px solid var(--ink); border-radius:14px; overflow:hidden; background:var(--surface); cursor:pointer; box-shadow:3px 3px 0 rgba(28,28,28,.18); transition:transform .12s, opacity .15s}
  .tile img{width:100%; height:100%; object-fit:cover; pointer-events:none}
  .tile:hover{transform:translateY(-2px)}
  .tile.gone{opacity:0; pointer-events:none; transform:scale(.6)}
  .tile.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1) backwards}
  @keyframes pop{0%{transform:scale(0)} 100%{transform:scale(1)}}
  .fly{position:fixed; z-index:60; border:3px solid var(--ink); border-radius:14px; overflow:hidden; background:var(--surface); pointer-events:none; will-change:transform}
  .fly img{width:100%; height:100%; object-fit:cover}
  .toy-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; min-height:44px}
  .toy-msg{font-size:.92rem; font-weight:600; color:var(--muted); line-height:1.35}
  .toy-btns{display:flex; gap:8px; flex:none}

  section{padding:56px 0}
  @media(min-width:900px){ section{padding:80px 0} }
  h2{font-size:clamp(1.9rem,4.6vw,2.7rem); line-height:1.12}
  .sec-h{margin-bottom:28px}

  /* ── 쓰는 법: 영상 + 세 걸음 ── */
  .how{display:grid; gap:28px; align-items:center}
  @media(min-width:860px){ .how{grid-template-columns:auto 1fr; gap:56px} }
  .reel{width:min(300px,78vw); aspect-ratio:400/712; margin:0 auto; border:4px solid var(--ink); border-radius:34px; overflow:hidden; background:var(--bg); box-shadow:var(--hard); transform:rotate(-2deg)}
  .reel video{width:100%; height:100%; object-fit:cover}
  .steps{display:grid; gap:14px; counter-reset:step; list-style:none; margin:0; padding:0}
  .steps li{counter-increment:step; display:grid; grid-template-columns:auto 1fr; gap:4px 16px; background:var(--surface); border:4px solid var(--ink); border-radius:24px; padding:18px 20px; box-shadow:4px 4px 0 var(--ink)}
  .steps li::before{content:counter(step); grid-row:1 / span 2; width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--yellow); border:3.5px solid var(--ink); font-family:var(--display); font-weight:700; font-size:1.3rem}
  .steps h3{font-size:1.3rem; align-self:end}
  .steps p{color:var(--muted); font-size:1rem; line-height:1.55}

  /* ── 먹는 것: 앱 홈의 타일 넷 ── */
  .eats{display:grid; gap:14px; grid-template-columns:1fr 1fr}
  @media(min-width:860px){ .eats{grid-template-columns:repeat(4,1fr)} }
  .eat{background:var(--surface); border:4px solid var(--ink); border-radius:24px; padding:18px 18px 20px; box-shadow:0 5px 0 var(--ink)}
  .eat .ic{width:52px; height:52px; border-radius:14px; background:var(--soft); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; margin-bottom:14px}
  .eat .ic svg{width:28px; height:28px}
  .eat h3{font-size:1.3rem}
  .eat p{color:var(--muted); font-size:.95rem; line-height:1.5; margin-top:6px}

  /* ── 안 하는 것 ── */
  .keep{background:var(--yellow); border-top:4px solid var(--ink); border-bottom:4px solid var(--ink)}
  .keep-grid{display:grid; gap:22px}
  @media(min-width:860px){ .keep-grid{grid-template-columns:.8fr 1.2fr; gap:18px 56px; align-items:start} .keep-grid .nots{grid-column:2; grid-row:1 / span 2} .keep-grid .free{grid-column:1; grid-row:2} }
  .nots{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  .nots li{display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:4px solid var(--ink); border-radius:20px; padding:14px 18px; font-weight:700; font-size:1.08rem; line-height:1.4}
  .nots svg{width:26px; height:26px; flex:none; margin-top:1px}
  .free{font-size:.98rem; line-height:1.6; font-weight:600}

  /* ── 앱 화면 ── */
  .shots{display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:6px 20px 22px; margin:0 -20px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
  .shots img{flex:none; width:min(250px,62vw); border:4px solid var(--ink); border-radius:26px; scroll-snap-align:center; box-shadow:4px 4px 0 var(--ink); background:var(--surface)}
  @media(min-width:1100px){ .shots{overflow:visible; justify-content:space-between; margin:0; padding:6px 0 22px} .shots img{width:calc(25% - 14px)} }

  .end{text-align:center; padding-bottom:72px}
  .end .nom-s{width:150px; margin:0 auto 6px}
  .end h2{margin-bottom:10px}
  .end p{color:var(--muted); font-weight:600; margin-bottom:24px}
  .search{display:inline-flex; align-items:center; gap:10px; background:var(--surface); border:4px solid var(--ink); border-radius:999px; padding:10px 22px; font-family:var(--display); font-weight:600; font-size:1.2rem; box-shadow:4px 4px 0 var(--ink); margin-bottom:22px}
  .search svg{width:22px; height:22px}

  footer{border-top:4px solid var(--ink); padding:28px 0 40px; font-size:.92rem; color:var(--muted)}
  .foot{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; justify-content:space-between}
  .foot nav{display:flex; flex-wrap:wrap; gap:8px 18px}
  .foot a{font-weight:700; text-decoration:none; color:var(--ink)}
  .foot a:hover{text-decoration:underline}

  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .nom,.btn,.tile,.belly,.nom .mouth{transition:none}
    .nom.gulp,.nom.burp,.cloud.go,.tile.pop{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><img src="assets/icon.webp" width="36" height="36" alt="">Nom</a>
    <div class="right">
      <div class="langs" id="langs" aria-label="Language">
        <button data-lang="ko">한국어</button>
        <button data-lang="en">EN</button>
        <button data-lang="ja">日本語</button>
        <button data-lang="zh">繁中</button>
      </div>
      <a class="btn small" data-store href="https://apps.apple.com/app/id6815784303">App Store</a>
    </div>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" data-i="sub"></p>
      <div class="cta">
        <a class="btn" data-store href="https://apps.apple.com/app/id6815784303"><span data-i="cta"></span></a>
        <span class="cta-note" data-i="ctaNote"></span>
      </div>
    </div>

    <div class="toy" id="toy">
      <div class="stage">
        <div class="say" id="say"></div>
        <svg class="cloud" id="cloud" viewBox="-18 -27 58 48" aria-hidden="true"><path d="M 0 0 c -10 -2 -12 -14 -2 -16 c 0 -10 14 -12 18 -4 c 10 -4 18 8 8 14 c 4 8 -8 14 -12 8 c -4 6 -14 4 -12 -2 z" fill="#FFFFFF" stroke="#1C1C1C" stroke-width="3"/></svg>
        <div class="shadow"></div>
        <div class="nom" id="nom" style="--fat:scale(1,1)">

    nom.classList.remove('burp'); void nom.offsetWidth; nom.classList.add('burp');
    var c = $('cloud'); c.classList.remove('go'); void c.getBoundingClientRect(); c.classList.add('go');
    say.textContent = UI[LANG].burp; say.hidden = false; note('digested');
    setTimeout(function(){ // 다 먹은 자리는 새 스크린샷으로 다시 찬다 — 계속 먹여 볼 수 있게
      var gone = tray.querySelectorAll('.tile.gone');
      gone.forEach(function(t, i){ t.classList.remove('gone'); t.classList.remove('pop'); void t.offsetWidth; t.style.animationDelay = (i*40)+'ms'; t.classList.add('pop'); });
      say.textContent = UI[LANG].hungry; busy = false; sync();
    }, reduce ? 600 : 2200);
  }
  function buildTray(){
    var set = TILESET[LANG] || 'en', h = '';
    for (var i = 1; i <= N; i++) h += '<button class="tile" type="button" aria-label="screenshot '+i+'"><img src="assets/tile-'+set+'-'+i+'.webp" width="220" height="220" alt=""></button>';
    tray.innerHTML = h; eaten = []; busy = false; sync();
  }
  tray.addEventListener('click', function(e){ var t = e.target.closest('.tile'); if (t) feed(t); });
  // 긋기: 누른 채 지나가는 칸을 전부 먹인다
  var dragging = false;
  tray.addEventListener('pointerdown', function(){ dragging = true; });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointercancel', function(){ dragging = false; });
  tray.addEventListener('pointermove', function(e){ if (!dragging) return; var el = document.elementFromPoint(e.clientX, e.clientY); var t = el && el.closest ? el.closest('.tile') : null; if (t && tray.contains(t)) feed(t); });
  $('spit').addEventListener('click', spit); $('digest').addEventListener('click', digest);
  // 눈이 손가락을 따라간다 · 가끔 깜빡인다
  var eyes = nom.querySelectorAll('.eye');
  window.addEventListener('pointermove', function(e){ if (reduce) return; var r = nom.getBoundingClientRect(); var dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height*0.23); var d = Math.max(1, Math.hypot(dx, dy)); var k = Math.min(5, d/40); eyes.forEach(function(el){ el.style.transform = 'translate(calc(-50% + '+(dx/d*k).toFixed(1)+'px), calc(-50% + '+(dy/d*k).toFixed(1)+'px))'; }); }, { passive:true });
  if (!reduce) setInterval(function(){ nom.classList.add('blink'); setTimeout(function(){ nom.classList.remove('blink'); }, 130); }, 3400);

  // ── 언어 ──
  function render(){
    var u = UI[LANG];
    document.documentElement.lang = u.htmlLang; document.title = u.title;
    $('h1').innerHTML = u.h1;
    document.querySelectorAll('[data-i]').forEach(function(el){ var v = u[el.getAttribute('data-i')]; if (typeof v === 'string') el.textContent = v; });
    $('nots').innerHTML = u.nots.map(function(t){ return '<li>'+CHECK+'<span>'+t+'</span></li>'; }).join('');
    $('shots').innerHTML = [1,2,3,4].map(function(i){ return '<img src="assets/shot-'+LANG+'-'+i+'.webp" width="480" height="1039" alt="'+u.shotsH+' '+i+'" loading="lazy">'; }).join('');
    say.textContent = u.hungry; say.hidden = false;
    buildTray(); note('hint');
    var v = $('reel'), was = !v.paused; v.poster = 'assets/reel-'+LANG+'.webp'; v.setAttribute('data-src', 'assets/reel-'+LANG+'.mp4');
    if (v.getAttribute('src')){ v.src = v.getAttribute('data-src'); if (was){ var p = v.play(); if (p && p.catch) p.catch(function(){}); } }
  }
  var buttons = document.querySelectorAll('#langs button');
  function apply(lang, save){ LANG = UI[lang] ? lang : 'en'; render(); buttons.forEach(function(b){ b.classList.toggle('on', b.dataset.lang === LANG); }); if (save){ try{ localStorage.setItem('nom-lang', LANG); }catch(e){} } }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang, true); }); });
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  var saved = null; try{ saved = localStorage.getItem('nom-lang'); }catch(e){}
  var sys = (navigator.language || 'en').slice(0,2).toLowerCase();
  apply((q && UI[q]) ? q : (saved && UI[saved]) ? saved : (UI[sys] ? sys : 'en'), false);

  // 영상은 보일 때만 받아서 튼다
  var reel = $('reel');
  if ('IntersectionObserver' in window && !reduce){
    new IntersectionObserver(function(es){ es.forEach(function(e){
      if (e.isIntersecting){ if (!reel.getAttribute('src')) reel.src = reel.getAttribute('data-src'); var p = reel.play(); if (p && p.catch) p.catch(function(){}); } else reel.pause();
    }); }, { threshold:0.3 }).observe(reel);
  } else { reel.controls = true; reel.src = reel.getAttribute('data-src'); }
})();
</script>
</body>
</html>
