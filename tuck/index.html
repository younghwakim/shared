<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 앱 제목과 같은 나눔스퀘어라운드 EB, 이 페이지에 쓰는 한·영·독·불 글자만 남겼다(일본어·번체는 앱처럼 시스템 글꼴) */
  @font-face{font-family:"NSR";src:url(assets/nsr-eb.woff) format("woff");font-weight:800;font-display:swap}
  @property --tint{syntax:'<color>';inherits:true;initial-value:#4C6FD8}
  /* 값은 brand.json. 기본은 앱의 「밤 서랍」, 시스템이 밝으면 앱의 밝은 테마. 강조색은 하나 = 지금 열린 서랍의 색 */
  :root{
    --bg:#F4F2EC; --surface:#E9E6DE; --line:#DCD8CF; --ink:#191A1E; --muted:#5B5952; --plate:#10131F;
    --lock:#10131F; --key:#1C2236; --locktext:#F3F6FC; --lockdim:#A3AAC2;
    --work:#3F6FA8; --personal:#7460B8; --family:#BF5A38; --moss:#4F8456; --rose:#B24E6A; --knob:#D9A24B;
    --tint:#4C6FD8; --cta:#191A1E; --ctatext:#F4F2EC;
    --round:"NSR","Pretendard Variable",Pretendard,-apple-system,sans-serif;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Segoe UI",sans-serif;
    --maxw:1140px; color-scheme:light;
    transition:--tint .5s ease;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#10131F; --surface:#181D2D; --line:#2B3248; --ink:#F3F6FC; --muted:#A3AAC2; --plate:transparent;
    --cta:#F3F6FC; --ctatext:#10131F; color-scheme:dark;
  }}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
  html[lang=en] body,html[lang=de] body,html[lang=fr] body{word-break:normal}
  html[lang=ja] body,html[lang=zh-Hant] body{word-break:normal;line-break:strict}
  img{display:block;max-width:100%;height:auto}
  a{color:inherit}
  h1,h2,h3,p,ul{margin:0;padding:0} ul{list-style:none}
  h1,h2,h3,.btn,.pin b,.keys button{font-family:var(--round);font-weight:800}
  html[lang=ja] h1,html[lang=ja] h2,html[lang=ja] h3,html[lang=zh-Hant] h1,html[lang=zh-Hant] h2,html[lang=zh-Hant] h3,html[lang=ja] .btn,html[lang=zh-Hant] .btn{font-family:var(--font)}
  :focus-visible{outline:3px solid var(--tint);outline-offset:3px;border-radius:6px}
  [hidden]{display:none!important}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,32px)}
  #mubi-home{max-width:var(--maxw)!important;padding:0 clamp(16px,4vw,32px)!important}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,32px);position:relative;z-index:20}
  .brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-family:var(--round);font-weight:800;font-size:1.28rem;letter-spacing:-.02em}
  .brand img{width:30px;height:30px;border-radius:8px}
  .right{display:flex;align-items:center;gap:8px}
  .langs{display:flex;position:relative}
  .langs button{min-width:44px;min-height:44px;padding:0 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .langs button.on{color:var(--ink);font-weight:800}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 24px;border-radius:14px;background:var(--cta);color:var(--ctatext);font-size:1.05rem;line-height:1;text-decoration:none;white-space:nowrap;transition:transform .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn.sm{min-height:44px;padding:0 15px;font-size:.92rem;border-radius:12px}
  /* 폰: 언어 여섯을 다 늘어놓을 자리가 없어 지금 언어만 보이고, 누르면 펼쳐진다 */
  @media(max-width:760px){
    .btn.sm{display:none}
    .langs{flex-direction:column;position:absolute;right:clamp(16px,4vw,32px);top:4px;background:var(--bg);border-radius:12px}
    .langs button:not(.on){display:none}
    .langs button.on::after{content:" ▾";font-size:.7em}
    .langs.open{box-shadow:0 12px 32px rgba(0,0,0,.35);border:1px solid var(--line)}
    .langs.open button{display:block;width:92px;text-align:left}
  }

  /* ── 첫 화면 ── */
  .hero{position:relative;overflow-x:clip;padding:clamp(8px,2vw,28px) 0 0}
  .hero::before{content:"";position:absolute;right:-12%;top:-6%;width:min(980px,120%);aspect-ratio:1;background:radial-gradient(closest-side,var(--tint),transparent);opacity:.34;pointer-events:none}
  .hero-grid{position:relative;display:grid;gap:18px}
  h1{font-size:clamp(2.05rem,4.7vw,3.7rem);line-height:1.16;letter-spacing:-.035em;text-wrap:balance}
  .sub{margin-top:12px;font-size:clamp(1rem,1.5vw,1.16rem);color:var(--muted);max-width:30em;line-height:1.55}
  .act{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:18px}
  .act small{font-size:.9rem;color:var(--muted);font-weight:600}
  .play{margin-top:20px}
  .chest{display:none}
  .pins-l{font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:8px}
  .pins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pin{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:56px;padding:6px 12px;border:1.5px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--ink);font:inherit;cursor:pointer;text-align:left;transition:background .25s,border-color .25s,color .25s}
  .pin b{font-size:1.14rem;line-height:1.1;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .pin span{font-size:.8rem;font-weight:600;color:var(--muted);line-height:1.2}
  .pin.on{background:var(--c);border-color:var(--c);color:#fff}
  .pin.on span{color:#fff}
  .quiet{margin-top:10px;font-size:.88rem;color:var(--muted);line-height:1.4}

  .stage{display:flex;justify-content:center}
  .phone{width:min(80vw,312px);flex:none;border-radius:clamp(40px,14cqw,50px);background:#05060B;padding:7px;box-shadow:0 0 0 1.5px #3A4158,0 40px 80px -28px rgba(0,0,0,.65);position:relative}
  .screen{position:relative;aspect-ratio:1206/2622;border-radius:38px;overflow:hidden;background:var(--lock);color:var(--locktext);container-type:inline-size}
  .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:15cqw}
  .ch{position:relative;width:46cqw;aspect-ratio:1}
  .ch img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .22s}
  .ch img.on{opacity:1}
  .msg{min-height:1.5em;font-size:4.7cqw;font-weight:600;color:var(--lockdim);margin-top:1.5cqw;text-align:center;padding:0 6cqw;line-height:1.3}
  .msg.err{color:#E98274}
  .dots{display:flex;gap:4cqw;margin:3.5cqw 0 5cqw}
  .dots i{width:3.6cqw;height:3.6cqw;border-radius:50%;background:#4C5778;transition:background .12s,transform .12s}
  .dots i.on{background:#F3F6FC;transform:scale(1.15)}
  .keys{display:grid;grid-template-columns:repeat(3,19.5cqw);gap:2.6cqw 6cqw}
  .keys button{min-width:44px;min-height:44px;aspect-ratio:1;border:0;border-radius:50%;background:var(--key);color:var(--locktext);font-size:7.2cqw;line-height:1;cursor:pointer;touch-action:manipulation;transition:background .12s,transform .08s}
  .keys button:active,.keys button.hit{background:#3A4568;transform:scale(.94)}
  .keys .ghost{background:none;font-family:var(--font);font-size:5.4cqw}
  .screen.shake .lock{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .bloom{position:absolute;inset:0;background:var(--tint);clip-path:circle(0 at 50% 100%);pointer-events:none;opacity:0}
  .bloom.go{opacity:1;clip-path:circle(125% at 50% 100%);transition:clip-path .45s cubic-bezier(.3,.7,.2,1)}
  .scr{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .22s}
  .scr.on{opacity:1}
  .relock{position:absolute;right:2%;top:7%;width:30%;height:44px;border:0;background:transparent;cursor:pointer;display:none}
  .relock.on{display:block}

  @media(min-width:900px){
    .hero{padding-bottom:clamp(20px,3vw,40px)}
    .hero-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:32px;align-items:center}
    .play{display:grid;grid-template-columns:clamp(180px,17vw,220px) minmax(0,1fr);gap:22px;align-items:center;margin-top:24px}
    .chest{display:block;position:relative;aspect-ratio:1;background:var(--plate);border-radius:26px}
    .chest img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .22s}
    .chest img.on{opacity:1}
    .pins{grid-template-columns:1fr;max-width:280px;gap:7px}
    .pin{flex-direction:row;align-items:center;justify-content:space-between;min-height:50px}
    .phone{width:min(312px,calc((100svh - 130px)*.46))}
  }
  @media(prefers-reduced-motion:reduce){:root{transition:none}.bloom{display:none}.scr,.ch img,.chest img{transition:none}.screen.shake .lock{animation:none}}

  section{padding:clamp(48px,7vw,96px) 0}
  h2{font-size:clamp(1.65rem,3.4vw,2.7rem);line-height:1.2;letter-spacing:-.03em;text-wrap:balance}

  /* ── 서랍으로 여는 기능 ── */
  .feats{margin-top:clamp(20px,3vw,34px);display:grid;gap:8px}
  .front{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:68px;padding:12px 18px;border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;text-align:left;cursor:pointer;position:relative;z-index:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px -12px rgba(0,0,0,.6)}
  .front h3{font-size:clamp(1.08rem,1.9vw,1.36rem);line-height:1.28;letter-spacing:-.02em;font-weight:800;color:#fff}
  .front i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--knob);box-shadow:inset 0 -2px 3px rgba(0,0,0,.28),0 2px 3px rgba(0,0,0,.35)}
  .panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.3,.7,.2,1)}
  .feat.open .panel{grid-template-rows:1fr}
  .panel>div{overflow:hidden;min-height:0}
  .inside{display:grid;gap:16px;margin:-14px 8px 0;padding:30px 18px 0;background:var(--surface);border-radius:0 0 14px 14px}
  .inside p{color:var(--muted);line-height:1.55;max-width:30em}
  .crop{height:clamp(300px,82vw,380px);overflow:hidden;border-radius:26px 26px 0 0;background:#05060B;padding:6px 6px 0;width:min(100%,290px);justify-self:center}
  .crop img{width:100%;height:auto;border-radius:20px 20px 0 0;aspect-ratio:640/1391}
  .feat[data-k=orig] .crop img{margin-top:-42%}
  @media(min-width:760px){
    .inside{grid-template-columns:minmax(0,1fr) 300px;align-items:end;gap:32px;padding:34px 34px 0}
    .inside p{padding-bottom:30px;font-size:1.1rem;align-self:center}
    .crop{justify-self:end}
  }
  @media(prefers-reduced-motion:reduce){.panel{transition:none}}

  /* ── 사실 ── */
  .facts-g{display:grid;gap:20px}
  @media(min-width:860px){.facts-g{grid-template-columns:1fr 1.15fr;gap:60px;align-items:start}}
  .facts li{padding:14px 0;border-bottom:1px solid var(--line);line-height:1.5;font-weight:600}
  .facts li:first-child{border-top:1px solid var(--line)}

  .end{padding-top:8px;padding-bottom:clamp(44px,6vw,80px);text-align:left}
  .end-g{display:grid;gap:18px;align-items:center}
  @media(min-width:760px){.end-g{grid-template-columns:320px 1fr;gap:44px}}
  .endchest{width:min(68vw,320px);background:var(--plate);border-radius:32px}
  .end .btn{margin-top:20px}

  footer{border-top:1px solid var(--line);padding:16px 0 32px;font-size:.92rem;color:var(--muted)}
  .foot{display:flex;flex-wrap:wrap;gap:0 20px;align-items:center;justify-content:space-between}
  .foot nav{display:flex;flex-wrap:wrap;gap:0 18px}
  .foot a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;font-weight:600;text-decoration:none}
  .foot a:hover{text-decoration:underline}
/* Safari 15 이하(아이폰 7 등)는 컨테이너 단위(cqw)·color-mix 를 모른다. 1cqw = 화면 너비의 1/100 (--q, 아래 스크립트가 잰다) */
@supports not (width:1cqw){.screen{--q:3px}.phone{border-radius:clamp(40px,14vw,50px)}.lock{padding-top:calc(var(--q)*15)}.ch{width:calc(var(--q)*46)}.msg{font-size:calc(var(--q)*4.7);margin-top:calc(var(--q)*1.5);padding:0 calc(var(--q)*6)}.dots{gap:calc(var(--q)*4);margin:calc(var(--q)*3.5) 0 calc(var(--q)*5)}.dots i{width:calc(var(--q)*3.6);height:calc(var(--q)*3.6)}.keys{grid-template-columns:repeat(3,calc(var(--q)*19.5));gap:calc(var(--q)*2.6) calc(var(--q)*6)}.keys button{font-size:calc(var(--q)*7.2)}.keys .ghost{font-size:calc(var(--q)*5.4)}}
@supports not (background:color-mix(in srgb,red 50%,transparent)){.pin{background:var(--bg)}}
</style>
</head>

<style>#mubi-home{box-sizing:border-box;width:100%;max-width:var(--maxw,1120px);margin:0 auto;padding:0 20px;position:relative;z-index:50}#mubi-home a{display:inline-flex;align-items:center;min-height:44px;padding-right:12px;font:800 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.02em;color:inherit;text-decoration:none;white-space:nowrap}#mubi-home a:hover{text-decoration:underline}</style>
<link rel="stylesheet" href="/shared/labs.css"><script src="/shared/labs.js" defer></script><div id="mubi-home"><a href="https://younghwakim.github.io/">mubi labs</a><div class="langs" id="langs" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ko">한국어</button><button data-lang="ja">日本語</button><button data-lang="zh">繁中</button><button data-lang="de">DE</button><button data-lang="fr">FR</button>

<script>(function(){var a=document.querySelector('#mubi-home a');function c(){var b=document.querySelector('button[data-lang].on,button[data-lang].active,button[data-lang][aria-pressed="true"],button[data-lang][aria-selected="true"]');var l=String(b?b.getAttribute('data-lang'):document.documentElement.lang).slice(0,2).toLowerCase();a.href='https://younghwakim.github.io/'+(/^(ko|en|ja|zh)$/.test(l)?'?lang='+l:'')}document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('button[data-lang]'))setTimeout(c,0)});new MutationObserver(c).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});addEventListener('load',c);c()})();</script>

<header class="bar">
  <a class="brand" href="#top"><img src="assets/icon.webp" width="30" height="30" alt=""><span>Tuck</span></a>
  <div class="right">
    <a class="btn sm" href="https://apps.apple.com/app/id6824168879">App Store</a>
  </div>
</header>

<main id="top">
<section class="hero" style="padding-bottom:0">
  <div class="wrap hero-grid">
    <div>
      <h1 id="h1" data-i="h1"></h1>
      <p class="sub" data-i="sub"></p>
      <div class="act">
        <a class="btn" href="https://apps.apple.com/app/id6824168879"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.2-.9-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 9.9.8 1.2 1.8 2.5 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.3c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.4z"/></svg><span data-i="cta"></span></a>
        <small data-i="note"></small>
      </div>
      <div class="play" id="play">
        <div class="chest" id="chestBig" aria-hidden="true">
          <img src="assets/drawer-mark-closed.webp" width="480" height="480" alt="" class="on" data-d="closed">
          <img src="assets/drawer-open-0.webp" width="480" height="480" alt="" data-d="0">
          <img src="assets/drawer-open-1.webp" width="480" height="480" alt="" data-d="1">
          <img src="assets/drawer-open-2.webp" width="480" height="480" alt="" data-d="2">
        </div>
        <div>
          <p class="pins-l" data-i="pinsL"></p>
          <div class="pins" id="pins"></div>
          <p class="quiet" data-i="quiet"></p>
        </div>
      </div>
    </div>
    <div class="stage">
      <div class="phone">
        <div class="screen" id="screen">
          <div class="lock">
            <div class="ch" id="chestIn" aria-hidden="true">
              <img src="assets/drawer-mark-closed.webp" width="480" height="480" alt="" class="on" data-d="closed">
              <img src="assets/drawer-open-0.webp" width="480" height="480" alt="" data-d="0">
              <img src="assets/drawer-open-1.webp" width="480" height="480" alt="" data-d="1">

<section aria-labelledby="featH">
  <div class="wrap">
    <h2 id="featH" data-i="featH"></h2>
    <div class="feats" id="feats"></div>
  </div>
</section>

<section style="padding-top:0" aria-labelledby="factH">
  <div class="wrap facts-g">
    <h2 id="factH" data-i="factH"></h2>
    <ul class="facts" id="facts"></ul>
  </div>
</section>

<section class="end" aria-labelledby="endH">
  <div class="wrap end-g">
    <img class="endchest" src="assets/drawer-mark.webp" width="720" height="720" alt="" loading="lazy">

    zh:{ htmlLang:'zh-Hant', dir:'zh', title:'Tuck — 隱藏照片・私密相簿',

        ['Gelöscht am Tag deiner Wahl','1, 7 oder 30 Tage, für ein Foto oder eine ganze Schublade. Gelöscht heißt endgültig gelöscht.']],

    fr:{ htmlLang:'fr', dir:'fr', title:'Tuck — Cacher photos & coffre',

  // 서랍 색·번호 — brand.json spaceWork·spacePersonal·spaceFamily, 화면은 store/captures 실제 캡처(work·personal·expire)
  var COLORS=['#3F6FA8','#7460B8','#BF5A38'], PINS=['1111','2222','3333'], SHOTS=['work','personal','expire'], LOCK_TINT='#4C6FD8';
  var FEATS=[['cover','#BF5A38','blur'],['hide','#3F6FA8','viewer'],['orig','#4F8456','originals'],['exp','#B24E6A','expire']];
  var LANG='en',$=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root=document.documentElement,screenEl=$('screen'),dots=$('dots').children,msg=$('msg'),bloom=$('bloom'),relock=$('relock');
  var typed='',open=-1,busy=false,feat=0,timers=[];
  function later(f,ms){var t=setTimeout(f,reduce?0:ms);timers.push(t);return t}
  function clearAll(){timers.forEach(clearTimeout);timers=[]}
  function paintDots(){for(var i=0;i<4;i++)dots[i].classList.toggle('on',i<typed.length)}
  function chest(d){document.querySelectorAll('#chestBig img,#chestIn img').forEach(function(im){im.classList.toggle('on',im.getAttribute('data-d')===String(d))})}
  function pinsOn(i){document.querySelectorAll('.pin').forEach(function(b,k){b.classList.toggle('on',k===i);b.setAttribute('aria-pressed',k===i?'true':'false')})}
  function setMsg(t,err){msg.textContent=t;msg.classList.toggle('err',!!err)}
  function showScreen(i){document.querySelectorAll('.scr').forEach(function(im,k){im.classList.toggle('on',k===i)});relock.classList.toggle('on',i>=0)}
  function openDrawer(i){
    open=i;typed='';paintDots();root.style.setProperty('--tint',COLORS[i]);chest(i);pinsOn(i);setMsg('');
    bloom.classList.remove('go');void bloom.offsetWidth;bloom.classList.add('go');
    // 번진 색이 다 덮은 뒤 화면을 올리고, 화면이 다 뜬 다음에 색을 걷는다 — 숫자판이 비쳐 보이지 않게
    later(function(){showScreen(i);busy=false},reduce?0:430);
    later(function(){bloom.classList.remove('go')},reduce?0:680);
  }
  function lockIt(){bloom.classList.remove('go');open=-1;typed='';paintDots();showScreen(-1);root.style.setProperty('--tint',LOCK_TINT);chest('closed');pinsOn(-1);setMsg(UI[LANG].enter)}
  function submit(){
    var i=PINS.indexOf(typed);
    if(i>=0){openDrawer(i);return}
    // 틀린 번호는 그것뿐이다. 다른 길을 권하지 않는다(특허 메모 infra/services/tuck.json)
    screenEl.classList.remove('shake');void screenEl.offsetWidth;screenEl.classList.add('shake');setMsg(UI[LANG].wrong,true);
    later(function(){typed='';paintDots();busy=false},500);
  }
  function typeAll(pin){
    busy=true;typed='';paintDots();
    pin.split('').forEach(function(ch,k){later(function(){typed+=ch;paintDots();
      var key=[].filter.call($('keys').querySelectorAll('button'),function(b){return b.textContent===ch})[0];
      if(key&&!reduce){key.classList.add('hit');setTimeout(function(){key.classList.remove('hit')},120)}
      if(k===3)later(submit,130);
    },reduce?0:140*(k+1))});
  }
  function pressPin(i){clearAll();if(open>=0){lockIt();later(function(){typeAll(PINS[i])},reduce?0:220)}else typeAll(PINS[i])}

  // 사람이 만지기 전까지 혼자 한 바퀴씩 돈다. 첫 화면을 안 눌러도 3초 안에 뜻이 보이게 — 이 페이지의 움직임은 여기 하나
  var auto=!reduce,autoI=0,autoT=null,visible=true;
  function step(){
    if(!auto||!visible||document.hidden){autoT=setTimeout(step,800);return}
    pressPin(autoI);autoI=(autoI+1)%3;autoT=setTimeout(step,3600);
  }
  function stopAuto(){auto=false;clearTimeout(autoT)}
  if(auto){autoT=setTimeout(step,900)}
  ['play','screen'].forEach(function(id){$(id).addEventListener('pointerdown',stopAuto)});
  if('IntersectionObserver' in window)new IntersectionObserver(function(e){visible=e[0].isIntersecting},{threshold:.2}).observe(screenEl);

  $('keys').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||busy||open>=0)return;
    if(b.getAttribute('data-k')==='del'){typed=typed.slice(0,-1);paintDots();return}
    if(typed.length>=4)return;
    typed+=b.textContent;paintDots();if(typed.length===4){busy=true;setTimeout(submit,120)}
  });
  $('pins').addEventListener('click',function(e){var b=e.target.closest('.pin');if(!b)return;stopAuto();busy=false;pressPin(+b.getAttribute('data-i'))});
  relock.addEventListener('click',function(){clearAll();busy=false;lockIt()});

  // ── 서랍 앞판 ──
  function renderFeats(){
    var u=UI[LANG],d=u.dir;
    $('feats').innerHTML=FEATS.map(function(f,i){
      var id='fp'+i;
      return '<div class="feat'+(i===feat?' open':'')+'" data-k="'+f[0]+'"><button type="button" class="front" style="--c:'+f[1]+'" aria-expanded="'+(i===feat)+'" aria-controls="'+id+'"><h3>'+u.feats[i][0]+'</h3><i aria-hidden="true"></i></button><div class="panel" id="'+id+'"><div><div class="inside"><p>'+u.feats[i][1]+'</p><div class="crop"><img src="assets/app/'+d+'/'+f[2]+'.webp" width="640" height="1391" alt="" loading="lazy"></div></div></div></div></div>';
    }).join('');
  }
  $('feats').addEventListener('click',function(e){
    var b=e.target.closest('.front');if(!b)return;
    var all=[].slice.call(document.querySelectorAll('.feat')),i=all.indexOf(b.parentNode);feat=i;
    all.forEach(function(el,k){el.classList.toggle('open',k===i);el.querySelector('.front').setAttribute('aria-expanded',k===i?'true':'false')});
  });

  // ── 언어 ──
  function render(){
    var u=UI[LANG];
    root.lang=u.htmlLang;document.title=u.title;
    document.querySelectorAll('[data-i]').forEach(function(el){var v=u[el.getAttribute('data-i')];if(typeof v==='string')el.textContent=v});
    $('pins').innerHTML=PINS.map(function(p,i){return '<button type="button" class="pin" data-i="'+i+'" style="--c:'+COLORS[i]+'" aria-pressed="false"><b>'+p+'</b><span>'+u.names[i]+'</span></button>'}).join('');
    pinsOn(open);
    document.querySelectorAll('.scr').forEach(function(im,k){im.src='assets/app/'+u.dir+'/'+SHOTS[k]+'.webp';im.alt=u.names[k]});
    relock.setAttribute('aria-label',u.relock);
    if(open<0)setMsg(u.enter);
    $('facts').innerHTML=u.facts.map(function(t){return '<li>'+t+'</li>'}).join('');
    renderFeats();
  }
  var langs=$('langs'),buttons=langs.querySelectorAll('button');
  function apply(lang,save){LANG=UI[lang]?lang:'en';render();buttons.forEach(function(b){b.classList.toggle('on',b.dataset.lang===LANG)});if(save){try{localStorage.setItem('tuck-lang',LANG)}catch(e){}}}
  buttons.forEach(function(b){b.addEventListener('click',function(){
    if(b.classList.contains('on')&&getComputedStyle(langs).position==='absolute'){langs.classList.toggle('open');return}
    langs.classList.remove('open');apply(b.dataset.lang,true);
  })});
  document.addEventListener('click',function(e){if(!e.target.closest('#langs'))langs.classList.remove('open')});
  var q=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}
  var saved=null;try{saved=localStorage.getItem('tuck-lang')}catch(e){}
  var sys=(navigator.language||'en').toLowerCase(),sys2=sys.slice(0,2);
  apply((q&&UI[q])?q:(saved&&UI[saved])?saved:(sys.indexOf('zh')===0?'zh':(UI[sys2]?sys2:'en')),false);
  if(reduce)openDrawer(0);
})();
</script>
<script>/* cqw 를 모르는 브라우저(Safari 15 이하)에서 폰 화면 1/100 너비를 --q 로 */(function(){if(window.CSS&&CSS.supports&&CSS.supports("width","1cqw"))return;var s=document.querySelector(".screen");if(!s)return;var f=function(){s.style.setProperty("--q",s.clientWidth/100+"px")};f();addEventListener("resize",f);addEventListener("load",f)})();</script>
