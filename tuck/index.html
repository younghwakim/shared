<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuck — Private Photo Vault</title>
<meta name="description" content="A different drawer for every PIN. Hide photos, videos and documents. No subscription, no account, no server. Your photos never leave your phone.">
<meta name="theme-color" content="#10131F">
<meta name="apple-itunes-app" content="app-id=6824168879">
<link rel="canonical" href="https://younghwakim.github.io/shared/tuck/">
<link rel="icon" href="assets/icon.webp">
<meta property="og:type" content="website">
<meta property="og:title" content="Tuck — Private Photo Vault">
<meta property="og:description" content="A different drawer for every PIN. No subscription, no account, no server.">
<meta property="og:image" content="https://younghwakim.github.io/shared/tuck/assets/og.jpg">
<meta property="og:url" content="https://younghwakim.github.io/shared/tuck/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* Tuck 의 색 — 앱과 같은 값(brand.json). 늘 밤 서랍(다크). 강조색은 화면마다 하나, 지금 열린 서랍의 색 */
  :root{
    --bg:#10131F; --surface:#181D2D; --raised:#212739; --line:#2B3248; --ink:#F3F6FC; --muted:#A3AAC2; --faint:#6E7692;
    --amber:#D9A24B; --amber-ink:#14140F; --glow:#4C6FD8; --key:#1C2236;
    --work:#3F6FA8; --personal:#7460B8; --family:#BF5A38; --moss:#4F8456; --rose:#B24E6A;
    --tint:var(--amber);
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Segoe UI",sans-serif;
    --maxw:1080px; --r:22px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.6; letter-spacing:-.01em; word-break:keep-all; overflow-wrap:break-word; overflow-x:hidden}
  html:not([lang="ko"]) body{word-break:normal}
  html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-break:strict}
  html[lang="zh-Hant"] body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
  img,video{max-width:100%; height:auto; display:block}
  a{color:inherit}
  h1,h2,h3,p{margin:0}
  h1,h2,h3{font-weight:800; letter-spacing:-.03em; text-wrap:balance}
  :focus-visible{outline:3px solid var(--amber); outline-offset:3px; border-radius:10px}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
  [hidden]{display:none !important}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:1.08rem; line-height:1; text-decoration:none; color:var(--amber-ink); background:linear-gradient(180deg,#F3B95F,#D6922B); border:0; border-radius:14px; padding:17px 26px; cursor:pointer; transition:transform .12s, filter .12s; white-space:nowrap}
  .btn:hover{transform:translateY(-1px); filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--raised); color:var(--ink); border:1.5px solid var(--line)}
  .btn.small{font-size:.95rem; padding:11px 16px; border-radius:11px}
  .btn svg{width:20px; height:20px; flex:none}

  header{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; height:66px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:900; font-size:1.4rem; letter-spacing:-.03em}
  .brand img{width:36px; height:36px; border-radius:10px}
  .right{display:flex; align-items:center; gap:10px}
  .langs{display:flex; gap:1px; background:var(--surface); border:1.5px solid var(--line); padding:3px; border-radius:999px; overflow-x:auto; scrollbar-width:none}
  .langs button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:.78rem; font-weight:700; padding:5px 9px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .langs button.on{background:var(--ink); color:var(--bg)}
  @media(max-width:640px){ header .btn{display:none} .langs button{padding:5px 7px; font-size:.74rem} }

  /* ── 첫 화면 ── */
  .hero{padding:28px 0 56px}
  .hero-grid{display:grid; gap:34px; align-items:center}
  @media(min-width:900px){ .hero{padding:56px 0 92px} .hero-grid{grid-template-columns:1.05fr .95fr; gap:52px} }
  h1{font-size:clamp(2.2rem,7.2vw,4rem); line-height:1.1}
  h1 .hl{color:var(--amber)}
  .sub{margin-top:18px; font-size:clamp(1.05rem,2.2vw,1.2rem); color:var(--muted); max-width:36ch; line-height:1.65}
  .cta{display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; margin-top:26px}
  .cta-note{font-size:.92rem; color:var(--muted); font-weight:600}
  .promise{display:flex; flex-wrap:wrap; gap:8px; margin-top:26px}
  .promise span{display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:6px 12px; font-size:.86rem; font-weight:700; color:var(--muted)}
  .promise svg{width:16px; height:16px; color:var(--amber)}

  /* 열어 보는 서랍 */
  .toy{position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:30px; padding:18px; max-width:420px; width:100%; margin:0 auto; transition:box-shadow .5s, border-color .5s; box-shadow:0 0 0 0 color-mix(in srgb, var(--tint) 0%, transparent)}
  .toy.open{border-color:color-mix(in srgb, var(--tint) 60%, var(--line)); box-shadow:0 0 70px -10px color-mix(in srgb, var(--tint) 55%, transparent)}
  .lock{display:grid; gap:14px; justify-items:center}
  .chest{width:150px; height:150px; position:relative}
  .chest img{position:absolute; inset:0; width:100%; height:100%; transition:opacity .35s}
  .chest img.on{opacity:1} .chest img:not(.on){opacity:0}
  .lock-msg{min-height:24px; font-size:.95rem; font-weight:600; color:var(--muted); text-align:center}
  .dots{display:flex; gap:12px; height:14px}
  .dots i{width:12px; height:12px; border-radius:50%; background:var(--line); transition:background .15s, transform .15s}
  .dots i.on{background:var(--glow); transform:scale(1.15)}
  .toy.shake .dots{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:270px}
  .pad button{height:58px; border:0; border-radius:16px; background:var(--key); color:var(--ink); font:inherit; font-size:1.35rem; font-weight:700; cursor:pointer; transition:transform .08s, background .12s}
  .pad button:hover{background:var(--raised)} .pad button:active{transform:scale(.95)}
  .pad button.dim{background:transparent; color:var(--muted); font-size:1rem}
  .pad button.wide{grid-column:2}
  .hintpins{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:4px}
  .hintpins button{border:1.5px solid var(--line); background:transparent; color:var(--muted); font:inherit; font-size:.8rem; font-weight:700; border-radius:999px; padding:4px 10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
  .hintpins button:hover{color:var(--ink); border-color:var(--muted)}
  .hintpins i{width:10px; height:10px; border-radius:50%; display:inline-block}

  .drawer{display:none; gap:12px}
  .toy.open .lock{display:none} .toy.open .drawer{display:grid}
  .dtop{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .dname{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.15rem}
  .dname i{width:14px; height:14px; border-radius:50%; background:var(--tint); display:inline-block; box-shadow:0 0 12px var(--tint)}
  .dname small{color:var(--muted); font-weight:600; font-size:.85rem}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .tile{position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden; background:var(--raised); border:1.5px solid var(--line); animation:pop .35s cubic-bezier(.3,1.5,.5,1) backwards}
  .tile:nth-child(2){animation-delay:.04s} .tile:nth-child(3){animation-delay:.08s} .tile:nth-child(4){animation-delay:.12s} .tile:nth-child(5){animation-delay:.16s} .tile:nth-child(6){animation-delay:.2s}
  @keyframes pop{0%{transform:scale(.6); opacity:0} 100%{transform:scale(1); opacity:1}}
  .tile svg{position:absolute; inset:0; width:100%; height:100%}
  .tile .bar{position:absolute; left:14%; height:11%; border-radius:3px; background:#0B0D14}
  .tile .badge{position:absolute; right:7px; bottom:7px; font-size:.62rem; font-weight:800; background:rgba(11,13,20,.75); color:var(--ink); border-radius:999px; padding:2px 7px}
  .dmsg{font-size:.9rem; color:var(--muted); line-height:1.5; min-height:44px}
  .dbtns{display:flex; gap:8px; justify-content:flex-end}

  section{padding:56px 0}
  @media(min-width:900px){ section{padding:84px 0} }
  h2{font-size:clamp(1.8rem,4.4vw,2.5rem); line-height:1.15}
  .sec-h{margin-bottom:10px}
  .sec-p{color:var(--muted); margin-bottom:28px; max-width:62ch}

  /* ── 약속 ── */
  .keep{background:var(--surface); border-top:1.5px solid var(--line); border-bottom:1.5px solid var(--line)}
  .nots{list-style:none; margin:0; padding:0; display:grid; gap:12px; grid-template-columns:1fr 1fr}
  @media(min-width:760px){ .nots{grid-template-columns:repeat(4,1fr)} }
  .nots li{display:flex; gap:12px; align-items:flex-start; background:var(--raised); border:1.5px solid var(--line); border-radius:18px; padding:16px 18px; font-weight:700; line-height:1.45}
  .nots svg{width:24px; height:24px; flex:none; margin-top:1px}
  .free{margin-top:18px; color:var(--muted); font-weight:600; line-height:1.6}
  .free b{color:var(--ink)}

  /* ── 하는 일 ── */
  .feats{display:grid; gap:14px}
  @media(min-width:760px){ .feats{grid-template-columns:1fr 1fr} }
  @media(min-width:1000px){ .feats{grid-template-columns:repeat(3,1fr)} }
  .feat{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:22px 22px 22px; position:relative; overflow:hidden}
  .feat::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c, var(--amber))}
  .feat .ic{width:46px; height:46px; border-radius:14px; background:color-mix(in srgb, var(--c, var(--amber)) 22%, var(--raised)); display:flex; align-items:center; justify-content:center; margin-bottom:14px}
  .feat .ic svg{width:26px; height:26px; color:var(--ink)}
  .feat h3{font-size:1.25rem}
  .feat p{color:var(--muted); font-size:.98rem; line-height:1.55; margin-top:6px}

  /* ── 무료·Pro ── */
  .plans{display:grid; gap:14px}
  @media(min-width:760px){ .plans{grid-template-columns:1fr 1fr} }
  .plan{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:24px}
  .plan.pro{border-color:color-mix(in srgb, var(--amber) 55%, var(--line))}
  .plan h3{font-size:1.4rem; display:flex; align-items:center; gap:10px}
  .plan h3 small{font-size:.8rem; font-weight:800; color:var(--amber-ink); background:var(--amber); border-radius:999px; padding:3px 9px}
  .plan ul{margin:14px 0 0; padding:0; list-style:none; display:grid; gap:8px}
  .plan li{display:flex; gap:10px; align-items:flex-start; color:var(--muted); font-weight:600; line-height:1.5}
  .plan li svg{width:20px; height:20px; flex:none; margin-top:3px}
  .plan p{margin-top:14px; font-size:.9rem; color:var(--faint); line-height:1.5}

  /* ── 앱 화면 ── */
  .shots{display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:6px 20px 22px; margin:0 -20px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
  .shots img{flex:none; width:min(230px,60vw); border-radius:26px; scroll-snap-align:center; border:1.5px solid var(--line); background:var(--surface)}
  @media(min-width:1100px){ .shots{overflow:visible; justify-content:space-between; margin:0; padding:6px 0 22px} .shots img{width:calc(16.66% - 14px)} }

  .end{text-align:center; padding-bottom:72px}
  .end img{width:110px; margin:0 auto 12px}
  .end h2{margin-bottom:10px}
  .end p{color:var(--muted); font-weight:600; margin-bottom:24px}

  footer{border-top:1.5px solid var(--line); padding:28px 0 40px; font-size:.92rem; color:var(--muted)}
  .foot{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; justify-content:space-between}
  .foot nav{display:flex; flex-wrap:wrap; gap:8px 18px}
  .foot a{font-weight:700; text-decoration:none; color:var(--ink)}
  .foot a:hover{text-decoration:underline}

  @media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .btn,.toy,.dots i{transition:none} .tile,.toy.shake .dots{animation:none} }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><img src="assets/icon.webp" width="36" height="36" alt="">Tuck</a>
    <div class="right">
      <div class="langs" id="langs" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="ko">한국어</button>
        <button data-lang="ja">日本語</button>
        <button data-lang="zh">繁中</button>
        <button data-lang="de">DE</button>
        <button data-lang="fr">FR</button>
      </div>
      <a class="btn small" href="https://apps.apple.com/app/id6824168879">App Store</a>
    </div>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" data-i="sub"></p>
      <div class="cta">
        <a class="btn" href="https://apps.apple.com/app/id6824168879"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.2-.9-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 9.9.8 1.2 1.8 2.5 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.3c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.4z"/></svg><span data-i="cta"></span></a>
        <span class="cta-note" data-i="ctaNote"></span>
      </div>
      <div class="promise" id="promise"></div>
    </div>

    <div class="toy" id="toy">
      <div class="lock">
        <div class="chest">
          <img src="assets/drawer-mark-closed.webp" width="480" height="480" alt="" class="on" data-d="closed">
          <img src="assets/drawer-open-0.webp" width="480" height="480" alt="" data-d="0">
          <img src="assets/drawer-open-1.webp" width="480" height="480" alt="" data-d="1">
          <img src="assets/drawer-open-2.webp" width="480" height="480" alt="" data-d="2">
        </div>
        <div class="lock-msg" id="lockMsg" aria-live="polite"></div>
        <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
        <div class="pad" id="pad">
          <button type="button">1</button><button type="button">2</button><button type="button">3</button>
          <button type="button">4</button><button type="button">5</button><button type="button">6</button>
          <button type="button">7</button><button type="button">8</button><button type="button">9</button>
          <button type="button" class="wide">0</button><button type="button" class="dim" data-k="del">⌫</button>
        </div>
        <div class="hintpins" id="hintpins"></div>
      </div>
      <div class="drawer">
        <div class="dtop"><div class="dname"><i></i><span id="dName"></span><small id="dCount"></small></div><button class="btn small ghost" id="lockBtn" type="button" data-i="lockBtn"></button></div>
        <div class="grid" id="grid"></div>
        <p class="dmsg" id="dMsg"></p>
        <div class="dbtns"><button class="btn small ghost" id="switchBtn" type="button" data-i="switchBtn"></button></div>
      </div>
    </div>
  </div>
</section>

<section class="keep" aria-labelledby="keepH">
  <div class="wrap">
    <h2 class="sec-h" id="keepH" data-i="keepH"></h2>
    <p class="sec-p" data-i="keepP"></p>
    <ul class="nots" id="nots"></ul>
    <p class="free" id="free"></p>
  </div>
</section>

<section aria-labelledby="featH">
  <div class="wrap">
    <h2 class="sec-h" id="featH" data-i="featH"></h2>
    <p class="sec-p" data-i="featP"></p>
    <div class="feats" id="feats"></div>
  </div>
</section>

<section aria-labelledby="planH" style="padding-top:8px">
  <div class="wrap">
    <h2 class="sec-h" id="planH" data-i="planH"></h2>
    <p class="sec-p" data-i="planP"></p>
    <div class="plans">
      <div class="plan"><h3 data-i="freeH"></h3><ul id="freeList"></ul></div>
      <div class="plan pro"><h3><span data-i="proH"></span><small data-i="proTag"></small></h3><ul id="proList"></ul><p data-i="proNote"></p></div>
    </div>
  </div>
</section>

<section aria-labelledby="shotsH" style="padding-top:8px">
  <div class="wrap">
    <h2 class="sec-h" id="shotsH" data-i="shotsH"></h2>
    <div class="shots" id="shots"></div>
  </div>
</section>

<section class="end">
  <div class="wrap">
    <img src="assets/drawer-mark.webp" width="720" height="720" alt="" loading="lazy">
    <h2 data-i="endH"></h2>
    <p data-i="endS"></p>
    <a class="btn" href="https://apps.apple.com/app/id6824168879"><span data-i="cta"></span></a>
  </div>
</section>
</main>

<footer>
  <div class="wrap foot">
    <span>© 2026 <a href="https://younghwakim.github.io/">mubi labs</a></span>
    <nav><a href="support.html" data-i="support"></a><a href="privacy.html" data-i="privacy"></a></nav>
  </div>
</footer>

  function paintDots(){ for (var i = 0; i < 4; i++) dots[i].classList.toggle('on', i < typed.length); }
  function tileSvg(i){
    var hues = [[COLORS[open], '#223'], ['#E9D8B0', '#A58C5A'], ['#9FB3C8', '#3D5068'], ['#D7A1A1', '#6E3B3B'], ['#B9D6B1', '#4A6B45'], ['#CFC3E8', '#5E4F8C']];
    var c = hues[i % hues.length];
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g'+open+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><rect width="100" height="100" fill="url(#g'+open+i+')"/><circle cx="'+(28+i*7)+'" cy="34" r="10" fill="rgba(255,255,255,.35)"/><path d="M0 100 L35 55 L55 75 L70 60 L100 100 Z" fill="rgba(0,0,0,.25)"/></svg>';
  }
  function openDrawer(i){
    var u = UI[LANG]; open = i; typed = ''; paintDots();
    toy.style.setProperty('--tint', COLORS[i]); showChest(i);
    $('dName').textContent = u.drawers[i]; $('dCount').textContent = (i === 0 ? 24 : i === 1 ? 57 : 12) + ' ' + u.items;
    var tiles = '';
    for (var k = 0; k < 6; k++){
      var isId = (k === 1);
      tiles += '<div class="tile">' + tileSvg(k) + (isId ? '<span class="bar" style="top:30%;width:52%"></span><span class="bar" style="top:52%;width:40%"></span><span class="badge">'+u.idBadge+'</span>' : '') + '</div>';
    }
    $('grid').innerHTML = tiles; $('dMsg').textContent = u.dMsg;
    setTimeout(function(){ toy.classList.add('open'); busy = false; }, 420);
  }
  function lock(){ toy.classList.remove('open'); toy.style.setProperty('--tint', 'var(--amber)'); showChest('closed'); open = -1; typed = ''; paintDots(); lockMsg.textContent = UI[LANG].lockHint; }
  function submit(){
    busy = true;
    var i = PINS.indexOf(typed);
    if (i >= 0){ lockMsg.textContent = ''; openDrawer(i); return; }
    toy.classList.remove('shake'); void toy.offsetWidth; toy.classList.add('shake');
    lockMsg.textContent = UI[LANG].wrong;
    setTimeout(function(){ typed = ''; paintDots(); busy = false; }, 500);
  }
  pad.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b || busy || open >= 0) return;
    if (b.getAttribute('data-k') === 'del'){ typed = typed.slice(0, -1); paintDots(); return; }
    if (typed.length >= 4) return;
    typed += b.textContent; paintDots();
    if (typed.length === 4) setTimeout(submit, 120);
  });
  $('hintpins').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b || busy || open >= 0) return; typed = b.getAttribute('data-pin'); paintDots(); setTimeout(submit, 150); });
  $('lockBtn').addEventListener('click', lock);
  $('switchBtn').addEventListener('click', lock);

  // ── 언어 ──
  function render(){
    var u = UI[LANG];
    document.documentElement.lang = u.htmlLang; document.title = u.title;
    $('h1').innerHTML = u.h1;
    document.querySelectorAll('[data-i]').forEach(function(el){ var v = u[el.getAttribute('data-i')]; if (typeof v === 'string') el.textContent = v; });
    $('promise').innerHTML = u.promise.map(function(t){ return '<span>'+CHECK.replace('viewBox', 'width="16" height="16" viewBox')+t+'</span>'; }).join('');
    $('hintpins').innerHTML = PINS.map(function(p, i){ return '<button type="button" data-pin="'+p+'"><i style="background:'+COLORS[i]+'"></i>'+p+' · '+u.drawers[i]+'</button>'; }).join('');
    $('nots').innerHTML = u.nots.map(function(t){ return '<li>'+CHECK+'<span>'+t+'</span></li>'; }).join('');
    $('free').innerHTML = u.free;
    $('feats').innerHTML = u.feats.map(function(f, i){ return '<div class="feat" style="--c:'+[COLORS[0],COLORS[1],'#4F8456',COLORS[2],'#B24E6A','#D9A24B'][i]+'"><div class="ic">'+FICON[i]+'</div><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div>'; }).join('');
    $('freeList').innerHTML = u.freeList.map(function(t){ return '<li>'+TICK+'<span>'+t+'</span></li>'; }).join('');
    $('proList').innerHTML = u.proList.map(function(t){ return '<li>'+TICK+'<span>'+t+'</span></li>'; }).join('');
    $('shots').innerHTML = [1,2,3,4,5,6].map(function(i){ return '<img src="assets/shot-'+LANG+'-'+i+'.webp" width="480" height="1039" alt="'+u.shotsH+' '+i+'" loading="lazy">'; }).join('');
    if (open >= 0) openDrawer(open); else lockMsg.textContent = u.lockHint;
  }
  var buttons = document.querySelectorAll('#langs button');
  function apply(lang, save){ LANG = UI[lang] ? lang : 'en'; render(); buttons.forEach(function(b){ b.classList.toggle('on', b.dataset.lang === LANG); }); if (save){ try{ localStorage.setItem('tuck-lang', LANG); }catch(e){} } }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang, true); }); });
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  var saved = null; try{ saved = localStorage.getItem('tuck-lang'); }catch(e){}
  var sys = (navigator.language || 'en').toLowerCase(); var sys2 = sys.slice(0,2);
  var guess = sys.indexOf('zh') === 0 ? 'zh' : (UI[sys2] ? sys2 : 'en');
  apply((q && UI[q]) ? q : (saved && UI[saved]) ? saved : guess, false);
})();
</script>
</body>
</html>
