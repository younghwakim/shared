<style>

      wallH:"同じ色なのに、絵はみんな違います。",
      wallP:"今日の絵は、今日描いた人どうしで先に見ます。昨日までの絵は誰でも見られます。",
      capA:"線をすべて残すので、描いていく様子をもう一度見られます。", capB:"ギャラリーでその日の絵をまとめて見ます。",

      calH:"一日くらい空いても大丈夫。", calP:"描かなかった日はカレンダーに空きが残るだけ。連続記録も罰もありません。描きたくなったら、短い広告を1回見ればその日の色で描けます。",
      f1:"登録はいりません。開いたらすぐ描けます。", f2:"コメントはありません。絵といいねだけです。", f3:"アプリの広告はその1つだけです。",
      origin:"色の名前は和田三造『配色事典』(1930年代)から取っています。",
      future:"明日の色は0時までわかりません。",
      endH:"今日の色は0時までです。", left:function(h,m){return "今いる場所で、あと"+h+"時間"+m+"分。"},
      fPrivacy:"プライバシーポリシー", fSupport:"お問い合わせ", fMore:"ほかのアプリ", weekdays:["日","月","火","水","木","金","土"] }
  };
  var T=window.TC, LANG='en', $=function(id){return document.getElementById(id)};
  function loc(){return LANG==='ko'?'ko-KR':LANG==='ja'?'ja-JP':'en-US'}
  function renderFields(){
    var rest=window.TC_NOW.rest, w=T.today.w;
    rest.forEach(function(o,k){ $('n'+k).textContent=w?w[o.i]:o.c.toUpperCase(); });
    $('stripes').innerHTML=rest.map(function(o){return '<div style="background:'+o.c+'"></div>'}).join('');
  }
  function bands(){
    document.querySelectorAll('[data-band]').forEach(function(el){ el.innerHTML=T.paletteFor(el.getAttribute('data-band')).c.map(function(c){return '<div style="background:'+c+'"></div>'}).join(''); });
    document.querySelectorAll('[data-day]').forEach(function(el){ var a=el.getAttribute('data-day').split('-'); el.textContent=new Intl.DateTimeFormat(loc(),{year:'numeric',month:'long',day:'numeric'}).format(new Date(+a[0],+a[1]-1,+a[2])); });
  }
  function renderCal(){
    // 달력 첫 주만 칠해진 달이 있어 이번 주를 끝으로 다섯 주를 보여 준다. 앞날 칸은 색을 안 보여 준다 — 색이 그날 열리는 것이 이 앱의 규칙(SPEC 색 규칙)
    var s=S[LANG], el=$('cal'), now=T.now, base=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()-28);
    var fm=new Intl.DateTimeFormat(loc(),{month:'long'}), a=fm.format(base), z=fm.format(now);
    var h='<b>'+(a===z?a:a+' – '+z)+'</b><div class="grid7">';
    s.weekdays.forEach(function(w){h+='<i>'+w+'</i>'});
    for(var d=0;d<35;d++){
      var dt=new Date(base.getFullYear(),base.getMonth(),base.getDate()+d), label=T.labelOf(dt), cls='dd';
      if(label>T.todayL){h+='<div class="dd future"><span>'+dt.getDate()+'</span></div>';continue}
      if(label===T.todayL)cls+=' today';
      h+='<div class="'+cls+'">'+T.paletteFor(label).c.map(function(c){return '<u style="background:'+c+'"></u>'}).join('')+'<span>'+dt.getDate()+'</span></div>';
    }
    el.innerHTML=h+'</div><p class="note">'+s.future+'</p>';
  }
  function tick(){
    var now=new Date(), mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1), left=Math.max(0,mid-now), h=Math.floor(left/3600000), m=Math.floor(left%3600000/60000);
    $('left').textContent=S[LANG].left(h,m);
    // 페이지를 켠 채 자정을 넘기면 새 색으로
    if(T.labelOf(now)!==T.todayL)location.reload();
  }
  function apply(lang,save){
    LANG=S[lang]?lang:'en'; var s=S[LANG];
    document.documentElement.lang=LANG; document.title=s.title;
    document.querySelectorAll('[data-i]').forEach(function(el){ var v=s[el.getAttribute('data-i')]; if(typeof v==='string')el.textContent=v; });
    document.querySelectorAll('[data-a]').forEach(function(el){ el.alt=s[el.getAttribute('data-a')]||''; });
    document.querySelectorAll('[data-shot]').forEach(function(el){ el.src='assets/app/'+LANG+'/'+el.getAttribute('data-shot')+'.webp'; });
    $('date').textContent=new Intl.DateTimeFormat(loc(),{month:'long',day:'numeric',weekday:'long'}).format(T.now);
    document.querySelectorAll('#langs button').forEach(function(b){ b.classList.toggle('on',b.dataset.lang===LANG); });
    renderFields(); bands(); renderCal(); tick();
    if(save){try{localStorage.setItem('todaycolor-lang',LANG)}catch(e){}}
  }
  document.querySelectorAll('#langs button').forEach(function(b){ b.addEventListener('click',function(){apply(b.dataset.lang,true)}); });

  // ── 직접 그려 보기: 바탕은 그날 가장 밝은 색(앱의 「오늘의 색 종이」), 붓은 네 가지 다 ──
  var cv=$('cv'),ctx=cv.getContext('2d'),paper=T.order[0].c,brush=T.order[3].c,strokes=[],cur=null,SIZE=20;

    ctx.fillStyle=paper;ctx.fillRect(0,0,cv.width,cv.height);ctx.lineCap='round';ctx.lineJoin='round';
    strokes.forEach(function(s){ctx.strokeStyle=s.c;ctx.lineWidth=SIZE;ctx.beginPath();s.p.forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});if(s.p.length===1)ctx.lineTo(s.p[0][0]+.1,s.p[0][1]);ctx.stroke()});
  }

  function up(){cur=null} cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  var tl=$('tl'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  } else tl.controls=true, tl.src='assets/wall/pool-timelapse.mp4';

  // 색은 기본으로 보이게 두고 첫 화면을 그릴 때만 붓질을 건다. 애니메이션이 멈추는 환경(백그라운드 탭·미리보기)에서 색이 숨은 채 남지 않게 끝나면 걷어 낸다
  if(!reduce){var de=document.documentElement;requestAnimationFrame(function(){de.classList.add('sweep');setTimeout(function(){de.classList.remove('sweep')},1200)})}

})();
