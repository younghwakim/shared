<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>부루다 — 차주에게 알림 보내기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230C5AC4'/%3E%3Crect x='30' y='38' width='52' height='30' rx='6' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Cpath d='M22 42 a16 16 0 0 0 0 22' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #F4F6FA; --card: #FFFFFF; --ink: #14181F; --ink2: #545C68; --ink3: #8A93A0;
  --line: #E2E6EC; --blue: #0C5AC4; --blue-deep: #08479C; --blue-soft: #E7EFFB;
  --warn: #B4540A; --danger: #D93025;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318; --card: #181C23; --ink: #EDF0F4; --ink2: #9AA3AF; --ink3: #6B7480;
    --line: #2A2F38; --blue: #0C5AC4; --blue-deep: #08479C; --blue-soft: #1B2B44;
    --warn: #E08A45; --danger: #F28B82;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  /* 한국어가 단어 중간에서 꺾이지 않게 */
  word-break: keep-all; }
main { max-width: 480px; margin: 0 auto; padding: 14px 14px 120px; }

/* ── 카드 패널: 인쇄된 카드의 연속 ── */
.cardpanel {
  background: linear-gradient(170deg, #0C5AC4 0%, #08479C 100%);
  border-radius: 18px; padding: 18px 18px 20px; color: #fff;
  display: flex; flex-direction: column; gap: 12px;
}
.cp-brand { display: flex; align-items: center; gap: 7px; }
.cp-name { font-size: 13px; font-weight: 800; letter-spacing: .4px; opacity: .92; }
.cp-title { font-size: 21px; font-weight: 900; letter-spacing: -0.4px; line-height: 1.3; }
.plate {
  background: #fff; border: 3px solid #1A1E26; border-radius: 10px;
  padding: 10px 12px; text-align: center;
  font-size: 30px; font-weight: 900; letter-spacing: 3px; color: #14181F;
  font-variant-numeric: tabular-nums;
}
.cp-check { font-size: 12px; opacity: .85; text-align: center; }
.cp-msg { background: rgba(255,255,255,.14); border-radius: 10px; padding: 9px 11px;
  font-size: 13px; line-height: 1.5; }
.cp-msg b { display: block; font-size: 11px; opacity: .75; margin-bottom: 2px; }

/* ── 메시지 선택 ── */
.sec-label { font-size: 13px; font-weight: 800; color: var(--ink2);
  letter-spacing: .4px; margin: 16px 2px 8px; }
.primary-tpl {
  width: 100%; text-align: left; cursor: pointer;
  border: 2px solid var(--blue); background: var(--blue-soft); border-radius: 14px;
  padding: 13px 15px; display: flex; align-items: center; gap: 12px;
}
.primary-tpl.off { border-color: var(--line); background: var(--card); }
.pt-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--blue);
  display: grid; place-items: center; flex-shrink: 0; }
.primary-tpl.off .pt-icon { background: var(--line); }
.pt-text { flex: 1; }
.pt-title { font-size: 16.5px; font-weight: 800; color: var(--ink); }
.pt-sub { font-size: 12.5px; color: var(--ink2); margin-top: 1px; }
.pt-check { width: 22px; height: 22px; border-radius: 50%; background: var(--blue);
  color: #fff; font-size: 13px; font-weight: 900; display: grid; place-items: center; }
.primary-tpl.off .pt-check { visibility: hidden; }

.grid6 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tpl {
  cursor: pointer; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 11px 12px; display: flex; align-items: center; gap: 8px;
}
.tpl.sel { border-color: var(--blue); background: var(--blue-soft); }
.tpl svg { flex-shrink: 0; }
.tpl span { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
.tpl.wide { grid-column: span 2; }
button.tpl, button.primary-tpl { font-family: inherit; }

.err-inline { color: var(--danger); font-size: 14px; text-align: center; margin-top: 12px; }

/* ── 하단 고정 바 ── */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.bar-inner { max-width: 480px; margin: 0 auto; }
.cta { display: flex; width: 100%; border: 0; border-radius: 14px; padding: 15px;
  font-size: 16.5px; font-weight: 800; cursor: pointer; text-decoration: none;
  align-items: center; justify-content: center; gap: 9px;
  background: var(--blue); color: #fff; font-family: inherit; letter-spacing: -0.2px; }
.cta:disabled { opacity: 0.4; cursor: default; }
.cta-note { text-align: center; font-size: 11px; color: var(--ink3); margin-top: 7px; }

/* ── 완료/막힘 화면 ── */
.state { text-align: center; padding: 46px 6px 10px; }
.done-ring { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-soft);
  display: grid; place-items: center; margin: 0 auto 16px; }
.done-ring .inner { width: 50px; height: 50px; border-radius: 50%; background: var(--blue);
  color: #fff; font-size: 26px; font-weight: 900; display: grid; place-items: center; }
.dead-plate { border: 3px dashed var(--line); border-radius: 10px; padding: 12px;
  text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 4px;
  color: var(--ink3); margin-bottom: 18px; background: var(--card); }
.state h2 { font-size: 21px; font-weight: 900; letter-spacing: -0.4px; margin-bottom: 8px; }
.state p { color: var(--ink2); font-size: 14px; line-height: 1.6; }
.state p b { color: var(--ink); }

/* ── 설치 카드 (Google Play / 아이폰 수요) ── */
.install { margin-top: 30px; background: var(--card); border: 1.5px solid var(--line);
  border-radius: 14px; padding: 15px; display: flex; align-items: center; gap: 12px;
  text-align: left; }
.install-icon { width: 42px; height: 42px; flex-shrink: 0; }
.install-icon img { width: 42px; height: 42px; border-radius: 11px; display: block; }
.gp-inline { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
.install-text { flex: 1; }
.install-text b { display: block; font-size: 15px; margin-bottom: 2px; }
.install-text span { font-size: 12.5px; color: var(--ink2); }
.install-btn { flex-shrink: 0; background: var(--blue); color: #fff; text-decoration: none;
  font-size: 13px; font-weight: 800; padding: 10px 15px; border-radius: 10px;
  border: 0; cursor: pointer; font-family: inherit; }
.install-btn.done-state { background: var(--line); color: var(--ink2); cursor: default; }

.spinner { width: 28px; height: 28px; margin: 80px auto; border: 3px solid var(--line);
  border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none; }
</style>
</head>

<main>
  <div id="loading"><div class="spinner"></div></div>

  <!-- 전송 화면 -->
  <section id="notify" class="hidden">
    <div class="cardpanel">
      <div class="cp-brand"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="7" y="9" width="14" height="8" rx="1.6"/><circle cx="10" cy="13" r="0.7" fill="#fff" stroke="none"/><circle cx="18" cy="13" r="0.7" fill="#fff" stroke="none"/><path d="M4.5 10.5 a4.5 4.5 0 0 0 0 5" stroke-linecap="round"/><path d="M2.3 8.8 a7.2 7.2 0 0 0 0 8.4" stroke-linecap="round"/></svg><span class="cp-name">부루다</span></div>
      <div class="cp-title">이 차의 차주에게<br>알림을 보냅니다</div>
      <div class="plate" id="plate"></div>
      <div class="cp-check">앞 차량의 번호판 뒷자리와 맞는지 확인하세요</div>
      <div class="cp-msg hidden" id="ownerMsg"><b>차주가 남긴 메시지</b><span id="ownerMsgText"></span></div>
    </div>

    <div class="sec-label">보낼 메시지</div>
    <button class="primary-tpl" id="primaryTpl">
      <span class="pt-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 16 L5 12 Q5 10 7 10 L17 10 Q19 10 19 12 L19 16"/><circle cx="7.5" cy="16" r="1.6"/><circle cx="16.5" cy="16" r="1.6"/><path d="M8 10 L9 7 L15 7 L16 10"/></svg></span>
      <span class="pt-text"><span class="pt-title">차를 빼주세요</span><br><span class="pt-sub">차량이 출입을 막고 있어요</span></span>
      <span class="pt-check">✓</span>
    </button>

    <div class="sec-label">다른 상황이라면</div>
    <div class="grid6" id="tplGrid"></div>
    <p class="err-inline hidden" id="sendErr"></p>
  </section>

  <!-- 완료 화면 -->
  <section id="done" class="hidden">
    <div class="state">
      <div class="done-ring"><div class="inner">✓</div></div>
      <h2>알림을 보냈어요</h2>
      <p id="doneDetail"></p>
    </div>
    <div class="install">
      <span class="install-icon" id="doneInstallIcon"></span>
      <span class="install-text"><b>부루다</b><span id="doneInstallSub"></span></span>
      <button class="install-btn" id="doneInstallBtn"></button>
    </div>
  </section>

  <!-- 막힘 화면 -->
  <section id="blocked" class="hidden">
    <div class="state">
      <div class="dead-plate">— — —</div>
      <h2 id="blockedTitle"></h2>
      <p id="blockedDetail"></p>
    </div>
    <div class="install">
      <span class="install-icon" id="blockInstallIcon"></span>
      <span class="install-text"><b>부루다</b><span id="blockInstallSub"></span></span>
      <button class="install-btn" id="blockInstallBtn"></button>
    </div>
  </section>
</main>

<div class="bar" id="sendBar" style="display:none">
  <div class="bar-inner">
    <button class="cta" id="sendBtn">「차를 빼주세요」 보내기</button>
    <div class="cta-note">보내는 사람 정보는 차주에게 전달되지 않습니다</div>
  </div>
</div>

  function setupInstall(iconEl, subEl, btnEl) {
    iconEl.innerHTML = '<img src="' + APP_ICON + '" alt="부루다 앱 아이콘">';
    if (!IS_IOS) {
      subEl.innerHTML = '<svg class="gp-inline" viewBox="0 0 24 24"><use href="#gplay"/></svg>Google Play에서 무료 설치';
      btnEl.textContent = '설치';
      btnEl.onclick = function () { location.href = STORE; };
      return;
    }
    subEl.textContent = '아이폰 버전은 준비 중이에요';
    var asked = false;
    try { asked = !!localStorage.getItem(IOS_ASKED_KEY); } catch (e) {}
    if (asked) {
      btnEl.textContent = '출시 요청됨';
      btnEl.classList.add('done-state');
      return;
    }
    btnEl.textContent = '출시 요청';
    btnEl.onclick = function () {
      btnEl.textContent = '출시 요청됨';
      btnEl.classList.add('done-state');
      btnEl.onclick = null;
      try { localStorage.setItem(IOS_ASKED_KEY, '1'); } catch (e) {}
      fetch(API + '/v1/web/metrics', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ metric: 'IOS_INSTALL_INTEREST' })
      }).catch(function () {});
    };
  }
  setupInstall($('doneInstallIcon'), $('doneInstallSub'), $('doneInstallBtn'));
  setupInstall($('blockInstallIcon'), $('blockInstallSub'), $('blockInstallBtn'));

  function show(id) {
    ['loading', 'notify', 'done', 'blocked'].forEach(function (s) {
      $(s).classList.toggle('hidden', s !== id);
    });
    $('sendBar').style.display = id === 'notify' ? 'block' : 'none';
  }

  function showBlocked(title, detail) {
    $('blockedTitle').textContent = title;
    $('blockedDetail').textContent = detail;
    show('blocked');
  }

  function select(id, title) {
    selectedId = id;
    selectedTitle = title;
    $('primaryTpl').classList.toggle('off', id !== PRIMARY.id);
    var items = $('tplGrid').querySelectorAll('.tpl');
    items.forEach(function (el) {
      el.classList.toggle('sel', Number(el.dataset.id) === id);
    });
    $('sendBtn').textContent = '「' + title + '」 보내기';
    $('sendErr').classList.add('hidden');
  }

  function renderTemplates() {
    $('primaryTpl').onclick = function () { select(PRIMARY.id, PRIMARY.title); };
    var grid = $('tplGrid');
    OTHERS.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'tpl' + (t.wide ? ' wide' : '');
      b.dataset.id = t.id;
      var color = t.warn ? 'var(--warn)' : 'var(--blue)';
      b.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + color
        + '" stroke-width="2.4" stroke-linecap="round">' + t.icon + '</svg><span>' + t.title + '</span>';
      b.onclick = function () { select(t.id, t.full); };
      grid.appendChild(b);
    });
  }

  function load() {
    if (!code) {
      showBlocked('잘못된 접근이에요', '부루다 카드의 QR 코드를 카메라로 스캔해서 열어주세요.');
      return;
    }
    fetch(API + '/v1/web/vehicles/' + encodeURIComponent(code))
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (r) {
        if (!r.ok) {
          showBlocked('유효하지 않은 QR 코드예요', '카드가 오래됐거나 차주가 등록을 해제했을 수 있어요.');
          return;
        }
        var v = r.body.data;
        if (!v.canNotify) {
          showBlocked('지금은 알림을 보낼 수 없어요', '차주가 알림을 받지 않는 상태예요. 잠시 후 다시 시도해보세요.');
          return;
        }
        $('plate').textContent = v.maskedPlate;
        if (v.ownerMessage) {
          $('ownerMsgText').textContent = v.ownerMessage;
          $('ownerMsg').classList.remove('hidden');
        }
        renderTemplates();
        show('notify');
      })
      .catch(function () {
        showBlocked('연결에 실패했어요', '네트워크 상태를 확인하고 페이지를 새로고침해주세요.');
      });
  }

  $('sendBtn').onclick = function () {
    if (sending) return;
    sending = true;
    $('sendBtn').disabled = true;
    $('sendBtn').textContent = '보내는 중…';
    fetch(API + '/v1/web/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ webCode: code, templateId: selectedId })
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (r) {
        if (r.ok) {
          var title = (r.body.data && r.body.data.templateTitle) || selectedTitle;
          $('doneDetail').innerHTML = '<b>「' + title + '」</b> 메시지가<br>차주 휴대폰으로 전송됐어요.<br>잠시 기다려 주세요.';
          show('done');
          return;
        }
        if (r.body.code === 'R001') {
          showBlocked('유효하지 않은 QR 코드예요', '카드가 오래됐거나 차주가 등록을 해제했을 수 있어요.');
          return;
        }
        fail(ERROR_MESSAGES[r.body.code] || '전송에 실패했어요. 잠시 후 다시 시도해주세요.');
      })
      .catch(function () { fail('네트워크 오류로 전송하지 못했어요. 다시 시도해주세요.'); });
  };

  function fail(message) {
    sending = false;
    $('sendBtn').disabled = false;
    $('sendBtn').textContent = '「' + selectedTitle + '」 보내기';
    $('sendErr').textContent = message;
    $('sendErr').classList.remove('hidden');
  }

  load();
})();
</script>
</body>
