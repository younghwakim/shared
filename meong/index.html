      endH:'選一個地方進去，待著就好。', support:'支援', privacy:'隱私權政策' }
  };
  var LANG = 'ko', CUR = 'fireworks';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tall = matchMedia('(max-aspect-ratio: 3/4)');
  function $(id){ return document.getElementById(id); }
  function go(path){ return BASE + path + (path.indexOf('?')>=0 ? '&' : '?') + 'lang=' + SVC[LANG]; }
  function imgFor(id){ return 'assets/place-'+id+(tall.matches?'-p':'-w')+'.webp'; }

  /* 장면 넘기기 — 이 페이지에서 움직이는 건 여기 하나뿐이다 */
  var front = $('sceneA'), back = $('sceneB'), clip = $('clip'), timer = null, touched = false;
  function caption(){
    var m = UI[LANG].modes[CUR];
    $('now').innerHTML = '<b>'+m[0]+'</b>'+m[1];
    $('enter').href = go('/world/?mode='+CUR);
    front.alt = m[0]+' — '+m[1];
    Array.prototype.forEach.call($('tabs').children, function(b){ var on = b.dataset.id === CUR; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); if (on && touched && b.scrollIntoView) { var box = $('tabs'); box.scrollTo({left:b.offsetLeft - box.offsetLeft - (box.clientWidth - b.offsetWidth)/2, behavior: reduce ? 'auto' : 'smooth'}); } });
  }
  function show(id){
    if (id === CUR) return;
    CUR = id; caption();
    var im = new Image();
    im.onload = function(){
      if (CUR !== id) return;
      back.removeAttribute('srcset'); back.src = im.src; back.alt = front.alt;
      back.classList.add('on'); front.classList.remove('on');
      var t = front; front = back; back = t;
      clipState();
    };
    im.src = imgFor(id);
    if (SOUND) playSound(id);
    schedule();
    var nx = ORDER[(ORDER.indexOf(id)+1)%ORDER.length]; new Image().src = imgFor(nx);
  }
  function step(d){ show(ORDER[(ORDER.indexOf(CUR)+d+ORDER.length)%ORDER.length]); }
  function schedule(){
    clearTimeout(timer);
    if (reduce || touched || SOUND || document.hidden) return;
    timer = setTimeout(function(){ if (heroSeen) step(1); else schedule(); }, CUR === 'fireworks' ? 14000 : 8000);
  }
  /* 불꽃 영상은 첫 화면이 보일 때만 받는다. 데이터 절약·움직임 줄이기면 받지 않는다 */
  var clipReady = false, heroSeen = true;
  function clipState(){
    if (!clipReady) return;
    if (CUR === 'fireworks' && heroSeen && !document.hidden) { clip.classList.add('on'); var p = clip.play(); if (p && p.catch) p.catch(function(){ clip.classList.remove('on'); }); }
    else { clip.classList.remove('on'); clip.pause(); }
  }
  function loadClip(){
    var c = navigator.connection;
    if (reduce || clipReady || (c && (c.saveData || /2g/.test(c.effectiveType||'')))) return;
    clipReady = true;
    clip.src = 'assets/fireworks-'+(tall.matches?'p':'w')+'.mp4';
    clipState();
  }
  if ('IntersectionObserver' in window) new IntersectionObserver(function(es){
    heroSeen = es[0].isIntersecting;
    if (heroSeen) { if (document.readyState === 'complete') loadClip(); else addEventListener('load', loadClip); }
    clipState(); schedule();
  }, {threshold:.35}).observe($('hero'));
  document.addEventListener('visibilitychange', function(){ clipState(); schedule(); });
  /* 폰에서는 옆으로 밀어 넘긴다 */
  var sx = null, sy = 0;
  $('hero').addEventListener('touchstart', function(e){ if (e.target.closest('.tabs')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  $('hero').addEventListener('touchend', function(e){ if (sx === null) return; var t = e.changedTouches[0], dx = t.clientX - sx; if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(t.clientY - sy) * 1.5) { touched = true; step(dx < 0 ? 1 : -1); } sx = null; }, {passive:true});

  /* 미리 듣기 — 서비스의 실제 녹음을 줄인 파일(같은 폴더). 누른 뒤에만 받는다 */
  var SOUND = false, ac = null, master = null, cur = null, bufs = {};
  function getBuf(id){ return bufs[id] || (bufs[id] = fetch('assets/snd-'+id+'.mp3').then(function(r){ if (!r.ok) throw 0; return r.arrayBuffer(); }).then(function(b){ return new Promise(function(ok, no){ ac.decodeAudioData(b, ok, no); }); })); }
  function fadeOut(n){ if (!n) return; var t = ac.currentTime; n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(n.g.gain.value, t); n.g.gain.linearRampToValueAtTime(0, t+.7); n.s.stop(t+.75); }
  function playSound(id){
    if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return setSound(false); ac = new AC(); master = ac.createGain(); master.connect(ac.destination); }
    if (ac.state === 'suspended') ac.resume();
    getBuf(id).then(function(buf){
      if (!SOUND || CUR !== id) return;
      fadeOut(cur);
      var s = ac.createBufferSource(), g = ac.createGain();
      s.buffer = buf; s.loop = true; s.loopStart = .06; s.loopEnd = buf.duration - .06;
      s.connect(g); g.connect(master); g.gain.value = 0;
      s.start(0, .06); g.gain.linearRampToValueAtTime(1, ac.currentTime + 1);
      cur = {s:s, g:g};
    }).catch(function(){ setSound(false); });
  }
  function setSound(on){
    SOUND = on;
    $('sndOn').setAttribute('aria-pressed', on); $('sndOff').setAttribute('aria-pressed', !on);
    if (on) playSound(CUR); else if (ac) { fadeOut(cur); cur = null; }
    schedule();
  }
  $('sndOn').addEventListener('click', function(){ if (!SOUND) setSound(true); });
  $('sndOff').addEventListener('click', function(){ if (SOUND) setSound(false); });

  function render(){
    var u = UI[LANG];
    document.documentElement.lang = u.htmlLang; document.title = u.title;
    $('h1').innerHTML = u.h1;
    document.querySelectorAll('[data-i]').forEach(function(el){ var v = u[el.getAttribute('data-i')]; if (typeof v === 'string') el.textContent = v; });
    document.querySelectorAll('[data-go]').forEach(function(a){ a.href = go(a.getAttribute('data-go')); });
    $('tabs').setAttribute('aria-label', u.tabsL); $('sndGroup').setAttribute('aria-label', u.sndL);
    $('tabs').innerHTML = ORDER.map(function(id){ return '<button data-id="'+id+'">'+u.modes[id][0]+'</button>'; }).join('');
    $('feat').innerHTML = u.feat.map(function(f){ return '<li><b>'+f[0]+'</b><span>'+f[1]+'</span></li>'; }).join('');
    var ui = $('uiShot'); ui.src = 'assets/ui-'+LANG+'.webp'; ui.alt = u.uiAlt;
    caption();
  }
  $('tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; touched = true; show(b.dataset.id); schedule(); });
  var buttons = document.querySelectorAll('#langs button');
  // 저장은 사람이 직접 고른 때만 — 자동으로 고른 언어를 저장하면 기기 언어를 바꿔도 옛 언어에 묶인다
  function apply(lang, save){ LANG = UI[lang] ? lang : 'en'; render(); buttons.forEach(function(b){ b.classList.toggle('on', b.dataset.lang === LANG); }); if (save){ try{ localStorage.setItem('meong-lang', LANG); }catch(e){} } }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang, true); }); });
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  var saved = null; try{ saved = localStorage.getItem('meong-lang'); }catch(e){}
  var sys = (navigator.language || 'en').slice(0,2).toLowerCase();
  apply((q && UI[q]) ? q : (saved && UI[saved]) ? saved : (sys==='ko'||sys==='ja'||sys==='zh' ? sys : 'en'), false);
  schedule();
})();
