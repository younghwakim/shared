  var LANG = 'ko';
  function $(id){ return document.getElementById(id); }
  function render(){
    var u = UI[LANG];
    document.documentElement.lang = u.htmlLang; document.title = u.title;
    $('h1').innerHTML = u.h1;
    document.querySelectorAll('[data-i]').forEach(function(el){ var v = u[el.getAttribute('data-i')]; if (typeof v === 'string') el.textContent = v; });

    document.querySelectorAll('[data-make]').forEach(function(a){ a.href = BASE + '/?new=1&theme=wedding&lang=' + LANG; });
    $('shopLink').href = BASE + u.path + '/shop';
    $('heroMap').src = 'assets/hero-'+LANG+'.webp'; $('shopImg').src = 'assets/shop-'+LANG+'.webp';
    $('heroMap').alt = u.h1.replace('<br>',' ');
    $('g1').src = 'assets/guest-'+LANG+'.webp'; $('g1').alt = u.guestLabel;
    $('themes').innerHTML = THEMES.map(function(id){ var t=u.themes[id]; return '<figure class="th"><img src="assets/th-'+id+'.webp" width="900" height="600" alt="'+t[0]+'" loading="lazy"><figcaption>'+t[0]+'</figcaption></figure>'; }).join('');

    $('pts').innerHTML = rows(u.pts); $('where').innerHTML = rows(u.where);
    $('steps').innerHTML = u.steps.map(function(s){ return '<li>'+s+'</li>'; }).join('');
  }

  }

  function apply(lang, save){ LANG = UI[lang] ? lang : 'en'; render(); buttons.forEach(function(b){ b.classList.toggle('on', b.dataset.lang === LANG); }); if (save){ try{ localStorage.setItem('petitmap-lang', LANG); }catch(e){} } }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang, true); }); });
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  var saved = null; try{ saved = localStorage.getItem('petitmap-lang'); }catch(e){}
  var sys = (navigator.language || 'en').slice(0,2).toLowerCase();
  apply((q && UI[q]) ? q : (saved && UI[saved]) ? saved : (sys==='ko'||sys==='ja'||sys==='zh' ? sys : 'en'), false);
